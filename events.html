p:8px}.list .item{display:grid;grid-template-columns:110px 1fr 150px;align-items:center;gap:12px}.list h2{margin:0;font-size:16px}.empty{padding:64px 20px;text-align:center;border:1px solid #30352e;border-radius:6px}.detail{max-width:880px;padding:30px 0}.detail h2{font-size:27px}.detail p{white-space:pre-wrap}.back{margin-bottom:24px}footer{border-top:1px solid #30352e;padding:30px 0;color:#a9ada4;font-size:13px}@media(max-width:750px){.wrap{padding:0 20px}.head{flex-wrap:wrap;padding-top:15px;padding-bottom:15px;gap:12px}nav{order:3;width:100%;gap:18px}.hero{padding:40px 0}h1{font-size:29px}.cards{grid-template-columns:1fr}.list .item{grid-template-columns:70px 1fr}.list .date{grid-column:2}.toolbar input{max-width:100%}}.head{min-height:72px}.head nav{justify-content:center;flex:1}.head nav a{white-space:nowrap;position:relative;padding:12px 0}.head nav a[aria-current]::after{content:"";position:absolute;bottom:4px;left:0;right:0;height:2px;background:#dfc58b}.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px;padding:20px 0 34px}.foot-grid>div{display:flex;flex-direction:column;align-items:flex-start;gap:12px}.foot-grid strong{color:#eee;font-size:15px}.foot-grid a:not(.logo){color:#c1c5bd;font-size:14px}.foot-grid a:hover{color:#dfc58b}.foot-grid p{margin:0}.foot-bottom{border-top:1px solid #30352e;padding:20px 0 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}@media(max-width:750px){.head nav{justify-content:flex-start;flex:auto;flex-wrap:nowrap;overflow-x:auto;gap:20px}.foot-grid{grid-template-columns:1fr 1fr;gap:24px}.foot-grid>div:first-child{grid-column:1/-1}.head .cta{margin-left:auto}}.account-links{display:flex;align-items:center;gap:14px;white-space:nowrap;font-size:13px;font-weight:650}.account-links>a:not(.cta):hover{color:#dfc58b}@media(max-width:1100px){.head{flex-wrap:wrap}.head nav{order:3;width:100%;flex:auto;justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}.account-links{margin-left:auto}}@media(max-width:480px){.account-links{gap:10px}.account-links .cta{display:none}}[hidden]{display:none!important}dialog{width:min(620px,92vw);background:#20241f;color:#eee;border:1px solid #41463e;border-radius:8px;padding:24px}dialog::backdrop{background:#000b}dialog label{display:block;margin:12px 0}dialog input,dialog textarea{display:block;width:100%;margin-top:6px;color:#eee;background:#141614;border:1px solid #41463e;border-radius:4px;padding:12px;font:inherit}.detail p{overflow-wrap:anywhere}.item h2{overflow-wrap:anywhere}</style></head><body><header><div class="wrap head"><a class="logo" href="./home.html" aria-label="ELEVOS 홈페이지">ELEVOS</a><nav aria-label="주 메뉴"><a href="./hall.html">명예의 전당</a><a href="./about.html">게임 소개</a><a href="./events.html">이벤트</a><a href="./notice.html">공지사항</a><a href="./community.html">자유게시판</a><a href="./guide.html">게임가이드</a></nav><div class="account-links"><a href="./login.html">로그인</a><a href="./signup.html">회원가입</a><a class="cta" href="./home.html">공식 홈페이지</a></div></div></header><section class="hero"><div class="wrap"><div class="eyebrow" id="en"></div><h1 id="title"></h1><p id="desc"></p></div></section><main class="wrap"><div class="toolbar" id="toolbar"><span id="count"></span><div><input type="search" id="search" placeholder="게시물 검색" aria-label="게시물 검색"> <button id="write" hidden disabled>글쓰기</button></div></div><p id="live-status" role="status"></p><div id="content"></div><button id="public-more" hidden>이전 게시물 더 보기</button><dialog id="post-dialog"><form id="post-form"><h2>자유게시판 글쓰기</h2><label>제목<input id="post-title" required maxlength="120"></label><label>본문<textarea id="post-body" rows="7" required maxlength="10000"></textarea></label><p>운영팀 검토 후 공개됩니다. 개인정보를 게시하지 마세요.</p><button type="submit">등록 요청</button> <button type="button" id="post-close">취소</button><p id="post-status" role="status"></p></form></dialog></main><footer><div class="wrap"><div class="foot-grid"><div><a class="logo" href="./home.html">ELEVOS</a><p>당신의 전설, 당신의 선수, 당신의 역사.</p><span>MANAGING SOCCER · OPEN BETA</span></div><div><strong>게임</strong><a href="./home.html">게임 소개</a><a href="./guide.html">게임가이드</a></div><div><strong>커뮤니티</strong><a href="./events.html">이벤트</a><a href="./notice.html">공지사항</a><a href="./community.html">자유게시판</a></div></div><div class="foot-bottom"><span>© 2026 ELEVOS. All rights reserved.</span><span>ELEVOS 공식 커뮤니티</span></div></div></footer><script>const data={"events":{"title":"이벤트","en":"EVENTS","desc":"감독님의 새로운 도전을 위한 특별한 혜택.","items":[["진행 중","오픈 베타 특별 보급","2026.11.24 – 12.31","베타 기간 동안 게임 내 선물함에서 대상 보급을 확인하세요. 실제 지급 조건과 수량은 게임 내 안내를 기준으로 합니다."],["안내","매일 접속 선물","베타 기간","게임에 접속하여 선물함에서 일일 보상을 확인하세요."],["안내","주말 접속 선물","베타 기간","주말 접속 보상은 게임 내 이벤트 안내에서 확인할 수 있습니다."]]},"notice":{"title":"공지사항","en":"NOTICE","desc":"ELEVOS의 운영 소식과 업데이트를 확인하세요.","items":[["안내","오픈 베타 이용 안내","초안","베타 기간에는 게임 기능과 밸런스가 변경될 수 있습니다."],["안내","게임 저장 및 계정 이용 안내","초안","기존 감독 계정으로 접속하여 저장된 커리어를 이용하세요."]]},"community":{"title":"자유게시판","en":"COMMUNITY","desc":"다른 감독들과 축구 이야기를 나누세요.","items":[]},"guide":{"title":"게임가이드","en":"GAME GUIDE","desc":"첫 번째 경기부터 전설적인 감독 커리어까지.","items":[["시작","처음 시작하기","","계정을 생성하고 구단을 선택한 뒤 튜토리얼을 진행하세요."],["선수","선수 카드와 시즌","","카드 등급과 시즌, 포지션, OVR을 확인해 선수단을 구성하세요."],["육성","선수 강화와 성장","","강화 화면에서 재료와 성공 확률, 실패 시 적용되는 규칙을 확인하세요."],["전술","선수단 및 전술 설정","","포메이션과 선수 포지션을 설정하고 경기 전 선발 명단을 확인하세요."],["경기","리그 및 경기 진행","","경기 결과와 리그 일정을 확인하고 구단을 운영하세요."],["시장","이적시장과 트레이드","","선수 영입과 판매, 트레이드를 통해 선수단을 개선하세요."]]}};const params=new URLSearchParams(location.search);const tab='events';const page=data[tab];const $=id=>document.getElementById(id);$('en').textContent=page.en;$('title').textContent=page.title;$('desc').textContent=page.desc;document.title=page.title+' | ELEVOS';document.querySelectorAll('nav a').forEach(a=>{if(a.getAttribute('href')==='./events.html')a.setAttribute('aria-current','page')});$('write').hidden=tab!=='community';function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}</script><script src="./firebase-config.js"></script><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import{getAuth,onAuthStateChanged,setPersistence,browserSessionPersistence}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import{getFirestore,collection,doc,getDocFromServer,getDocsFromServer,query,where,orderBy,documentId,limit,startAfter,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const app=initializeApp(window.ELEVOS_FIREBASE_CONFIG),auth=getAuth(app),db=getFirestore(app);
let posts=[],cursor=null,busy=false;const status=t=>$('live-status').textContent=t;const post=params.get('post');const fmt=v=>v?.toDate?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium'}).format(v.toDate()):'';
function render(){const q=$('search').value.trim().toLowerCase(),items=posts.filter(v=>[v.title,v.body,v.author].some(t=>String(t||'').toLowerCase().includes(q)));$('count').textContent='불러온 게시물 '+items.length+'건';const c=$('content');c.replaceChildren();c.className=tab==='events'?'cards':'list';if(!items.length){const n=el('div','empty',q?'검색 결과가 없습니다.':'아직 등록된 게시물이 없습니다.');n.style.gridColumn='1 / -1';c.append(n)}for(const v of items){const a=el('a','item');a.href='?post='+encodeURIComponent(v.id);a.append(el('span','tag',v.author||'ELEVOS'),el('h2','',v.title),el('span','date',fmt(v.createdAt)));if(tab==='events')a.append(el('p','',v.body.slice(0,150)));c.append(a)}}
async function load(more=false){if(busy)return;busy=true;status('게시물 불러오는 중...');try{const filters=[where('published','==',true),orderBy(documentId()),limit(100)];if(more&&cursor)filters.push(startAfter(cursor));const s=await getDocsFromServer(query(collection(db,'publicPosts'),...filters));const batch=s.docs.map(d=>({id:d.id,...d.data()})).filter(v=>v.category===tab);posts=more?[...posts,...batch]:batch;posts.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));cursor=s.size===100?s.docs.at(-1):null;$('public-more').hidden=!cursor;status('');render()}catch{status('게시물을 불러오지 못했습니다. 잠시 후 다시 시도하세요.')}finally{busy=false}}
async function detail(){ $('toolbar').hidden=true;const c=$('content');c.className='detail';const back=el('a','back','목록으로');back.href='./events.html';c.append(back);try{const d=await getDocFromServer(doc(db,'publicPosts',post));if(!d.exists()||d.data().published!==true||d.data().category!==tab)throw Error();const v=d.data();c.append(el('h2','',v.title),el('span','date',v.author+' · '+fmt(v.createdAt)),el('p','',v.body))}catch{c.append(el('p','','게시물을 확인할 수 없습니다.'))}}
$('search').oninput=render;$('public-more').onclick=()=>load(true);
$('write').onclick=()=>{if(!auth.currentUser){location.href='./login.html?next=community';return}$('post-dialog').showModal()};$('post-close').onclick=()=>$('post-dialog').close();
$('post-form').onsubmit=async e=>{e.preventDefault();const u=auth.currentUser;if(!u)return;const b=e.currentTarget.querySelector('button[type=submit]');b.disabled=true;try{const p=await getDocFromServer(doc(db,'users',u.uid));if(!p.exists()||auth.currentUser?.uid!==u.uid)throw Error();const title=$('post-title').value.trim(),body=$('post-body').value.trim();if(!title||!body)throw Error();await addDoc(collection(db,'publicPosts'),{category:'community',title,body,author:p.data().username,published:false,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});$('post-form').reset();$('post-dialog').close();status('등록 요청 완료. 운영팀 검토 후 공개됩니다.')}catch{$('post-status').textContent='등록 실패. 로그인 및 입력 내용을 확인하세요.'}finally{b.disabled=false}};
try{await setPersistence(auth,browserSessionPersistence);onAuthStateChanged(auth,u=>{$('write').disabled=false;$('write').textContent=u?'글쓰기':'로그인 후 글쓰기';if(!u&&$('post-dialog').open)$('post-dialog').close()})}catch{}
if(post)detail();else load();
</script></body></html>
