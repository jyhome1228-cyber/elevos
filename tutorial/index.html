<div class="match-field" id="matchField"><div class="match-mid"></div></div><div class="match-panel" id="matchPanel"></div><div class="match-caption" id="matchCaption"></div></section><section id="enhanceStage" class="enhance-stage" hidden aria-label="선수 강화 시연"><div class="squad-head"><strong>선수 강화</strong><span>DEMO · 예시 수치</span></div><div id="enhanceBody"></div><div id="enhanceCaption" class="enhance-caption"></div></section><div class="steps" id="steps"></div><div class="demo-cursor" id="cursor" aria-hidden="true" hidden><svg viewBox="0 0 24 28"><path d="M3 2L21 18L12 19L9 26Z" fill="#fff" stroke="#141b25" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="demo-controls"><button id="replay">다시 시연</button><button id="pause">일시정지</button><small id="sceneCount"></small></div></div></div></div><div class="progress" id="progress" aria-hidden="true"></div><footer><button id="skip">건너뛰기</button><span class="spacer"></span><button id="prev">이전</button><button class="primary" id="next">다음 단계</button></footer></dialog><script>
'use strict';
const base='https://nineworksdatabase.planus253.workers.dev/cdn/uncategorized/';
const images=['20261128-044041-11-f875d795.webp','20261128-044041-222-e2b9db92.webp','20261128-044042-333-4d1e8932.webp','20261128-044042-444-bec12d00.webp','20261128-044042-555-8aa43fad.webp'].map(x=>base+x);
const poseNames=['환영 인사','기능 소개','상세 설명','격려','마무리 인사'];
const assets=images.map(src=>{const img=new Image();let ready=new Promise(resolve=>{img.onload=()=>resolve(true);img.onerror=()=>resolve(false);img.src=src});return {img,ready}});
let portraitToken=0,activeLayer=-1,activePose=-1;
async function showPortrait(pose){
 const token=++portraitToken, layers=[el('portrait'),el('portraitAlt')], status=el('portraitStatus');
 if(activePose===pose&&activeLayer>=0){status.hidden=true;return}
 status.hidden=activeLayer>=0;
 let ok=await assets[pose].ready;
 if(token!==portraitToken||!guide.open)return;
 if(!ok){status.textContent='안내원 이미지를 불러오지 못했습니다.';status.hidden=false;layers.forEach(n=>n.classList.remove('visible'));activeLayer=-1;activePose=-1;return}
 const next=activeLayer===0?1:0,node=layers[next];
 node.src=assets[pose].img.src;
 try{if(node.decode)await node.decode()}catch{}
 if(token!==portraitToken||!guide.open)return;
 if(!node.complete||!node.naturalWidth){status.textContent='안내원 이미지를 불러오지 못했습니다.';status.hidden=false;layers.forEach(n=>n.classList.remove('visible'));activeLayer=-1;activePose=-1;return}
 node.alt='구단 운영 안내원 · '+poseNames[pose];node.removeAttribute('aria-hidden');node.classList.add('visible');
 if(activeLayer>=0){layers[activeLayer].classList.remove('visible');layers[activeLayer].setAttribute('aria-hidden','true');layers[activeLayer].alt=''}
 activeLayer=next;activePose=pose;status.hidden=true;
}
const pages=[

function togglePause(){paused=!paused;el('matchStage').classList.toggle('paused',paused);el('pause').textContent=paused?'계속 재생':'일시정지';if(paused)stopScene();else runScene()}
function render(){stop();guide.classList.toggle('intro',page===0);el('enhanceStage').hidden=page!==5;el('enhanceStage').closest('.demo').classList.toggle('enhance-demo',page===5);el('matchStage').hidden=page!==4;el('matchStage').closest('.demo').classList.toggle('match-demo',page===4);el('tacticsStage').hidden=page!==3;el('tacticsStage').closest('.demo').classList.toggle('tactics-demo',page===3);el('squadStage').hidden=page!==2;el('squadStage').closest('.demo').classList.toggle('squad-demo',page===2);el('supplyStage').hidden=page!==1;el('supplyStage').closest('.demo').classList.toggle('supply-demo',page===1);el('welcomePanel').hidden=page!==0;const [pose,title,desc,steps]=pages[page];showPortrait(pose);const content=el('title').parentElement;content.classList.remove('scene-enter');void content.offsetWidth;content.classList.add('scene-enter');el('title').textContent=title;speak(desc);el('count').textContent=String(page+1).padStart(2,'0')+' / '+pages.length;el('steps').replaceChildren(...steps.map(s=>{const n=document.createElement('span');n.className='step';n.textContent=s;return n}));el('progress').replaceChildren(...pages.map((_,i)=>{const n=document.createElement('span');if(i<=page)n.className='done';return n}));el('prev').disabled=page===0;el('next').textContent=page===pages.length-1?'감독 생활 시작하기':page===0?'구단 운영 가이드 시작하기':'다음 단계';replay();el('pause').disabled=motion.matches; if(page===0)stopScene()}
el('desc').onclick=finishSpeech;el('pause').onclick=togglePause;
motion.addEventListener('change',()=>{if(!guide.open)return;if(motion.matches)finishSpeech();el('pause').disabled=motion.matches;runScene()});
window.addEventListener('resize',()=>{if(guide.open&&!paused&&!motion.matches){const node=el('steps').children[sceneIndex];if(node)moveCursor(sceneTarget(node))}});
document.addEventListener('visibilitychange',()=>{if(!guide.open)return;if(document.hidden){stopScene();finishSpeech()}else if(!paused)runScene()});
function openGuide(){page=0;document.body.classList.remove('closed');guide.showModal();render()}
function closeGuide(){stop();guide.close()}
guide.addEventListener('close',()=>{portraitToken++;stop();document.body.classList.add('closed');el('launch').focus()});el('close').onclick=closeGuide;el('skip').onclick=closeGuide;el('launch').onclick=openGuide;el('replay').onclick=replay;el('prev').onclick=()=>{if(page>0){page--;render()}};el('next').onclick=()=>{if(page===pages.length-1)closeGuide();else{page++;render()}};openGuide();
</script></body></html>
