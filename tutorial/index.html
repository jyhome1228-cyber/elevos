<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELEVOS 신규 감독 가이드</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#f4f6fa;font-family:Pretendard,system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}dialog{position:relative;inset:auto;margin:0;width:min(1100px,100%);max-height:calc(100dvh - 40px);overflow:auto;border:1px solid #374252;border-radius:16px;background:#18212e;color:inherit;padding:24px;box-shadow:0 24px 80px #0008}header,footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{letter-spacing:.16em}header small{margin-left:auto;color:#bbc5d3}.layout{display:grid;grid-template-columns:30% 1fr;gap:24px;min-height:460px;margin:20px 0}.portrait{position:relative;min-height:300px;overflow:hidden;background:radial-gradient(ellipse at center,#34475f,transparent 70%)}.portrait img{position:absolute;width:100%;height:100%;object-fit:contain;object-position:center bottom;animation:appear .4s ease both}.content{display:flex;flex-direction:column;justify-content:center;min-width:0}h1{font-size:clamp(22px,3vw,32px);margin:12px 0}p{line-height:1.75;color:#c5cedb;margin:0 0 16px}.demo{border:1px solid #40506a;background:#101722;border-radius:10px;min-height:170px;padding:20px;display:grid;align-content:center;gap:10px}.demo small{color:#aab8cb}.steps{display:flex;flex-wrap:wrap;gap:8px}.step{border:1px solid #43516a;border-radius:7px;padding:10px;font-size:14px;color:#bcc6d4}.step.active{border-color:#d9bd83;color:#fff;background:#51452f}.progress{display:flex;gap:5px;margin:16px 0}.progress span{flex:1;height:4px;background:#3c4656;border-radius:4px}.progress .done{background:#d9bd83}button,a{font:inherit}button{cursor:pointer;color:inherit;background:#273345;border:1px solid #4b586b;border-radius:8px;padding:11px 16px}button:disabled{opacity:.4;cursor:default}button.primary{background:#d9bd83;color:#151a22;border-color:transparent;font-weight:700}footer .spacer{flex:1}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}#launch{display:none}body.closed #launch{display:block}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:650px){.layout{grid-template-columns:1fr;gap:10px;min-height:0}.portrait{height:200px;min-height:0}dialog{padding:16px}.demo{min-height:140px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><button id="launch">가이드 다시 보기</button><dialog id="guide" aria-labelledby="title"><header><strong>ELEVOS</strong><span>신규 감독 가이드</span><small id="count"></small><button id="close" aria-label="닫기">닫기</button></header><div class="layout"><div class="portrait"><img id="portrait" alt="구단 운영 안내원"></div><div class="content"><h1 id="title"></h1><p id="desc"></p><div class="demo"><small>시연 준비 화면 · 실제 게임 데이터와 무관</small><div class="steps" id="steps"></div><button id="replay">다시 시연</button></div></div></div><div class="progress" id="progress" aria-hidden="true"></div><footer><button id="skip">건너뛰기</button><span class="spacer"></span><button id="prev">이전</button><button class="primary" id="next">다음 단계</button></footer></dialog><script>
'use strict';
const base='https://nineworksdatabase.planus253.workers.dev/cdn/uncategorized/';
const images=['20261128-044041-11-f875d795.webp','20261128-044041-222-e2b9db92.webp','20261128-044042-333-4d1e8932.webp','20261128-044042-444-bec12d00.webp','20261128-044042-555-8aa43fad.webp'].map(x=>base+x);
images.forEach(src=>{const img=new Image();img.src=src});
const pages=[
[0,'반갑습니다, 감독님!','새로운 감독으로 취임하신 것을 축하드립니다. 지금부터 구단 운영에 필요한 주요 기능을 간단히 안내해 드리겠습니다.',['감독 취임','구단 운영 가이드']],
[1,'함께할 선수들을 영입해 보세요.','선물함과 보급품을 확인하고 카드팩을 개봉해 선수를 영입하세요.',['선물함','보급 수령','카드팩 개봉']],
[1,'선수단을 구성해 보세요.','선발 11명, 후보, 2군을 구성하고 포지션과 능력치를 확인하세요.',['선수 선택','선발 등록','후보 및 2군','저장']],
[1,'우리 팀만의 전술을 만들어 보세요.','포메이션과 선수 위치를 조정하고 전술을 저장하세요.',['포메이션 선택','선수 배치','저장']],
[3,'첫 경기를 시작해 볼까요?','리그에서 일반 또는 자동 경기를 진행하고 PK와 1:1 찬스에 참여하세요.',['리그 선택','경기 시작','경기 진행','보상']],
[3,'선수를 강화해 보세요.','선수와 재료를 선택하고 성공 확률과 실패 조건을 확인하세요.',['대상 선택','재료 등록','확률 확인','강화']],
[2,'선수의 잠재력을 높여 주세요.','경기 경험치와 능력치 포인트를 활용하고 특수 성장에 도전하세요.',['경험치','능력치 분배','특수 성장']],
[2,'이적시장을 활용해 보세요.','선수 검색, 구매, 판매 및 트레이드로 선수단을 보강하세요.',['검색','구매','판매','트레이드']],
[1,'필요한 아이템을 준비하세요.','상점에서 가격과 수량을 확인한 뒤 카드팩과 아이템을 구매하세요.',['상점','아이템 선택','수량 확인','구매']],
[2,'구단을 체계적으로 관리하세요.','급여와 청구서, 부상 치료를 관리하고 불필요한 선수카드를 소각하세요. 소각 전 대상을 반드시 확인하세요.',['청구서','부상 치료','소각 대상 선택','최종 확인']],
[3,'더 큰 무대에 도전해 보세요.','정규 리그 외에도 컵 대회와 월드리그가 있습니다. 대회별 참가 조건과 특별 선수카드 및 자금 보상을 확인하세요.',['대회 목록','참가 조건','우승','특별 보상']],
[4,'모든 준비가 끝났습니다, 감독님!','감독님의 성공적인 첫 시즌을 응원하겠습니다.',['감독 생활 시작']]
];
const el=id=>document.getElementById(id),guide=el('guide');let page=0,timer=null;
function stop(){clearInterval(timer);timer=null}
function replay(){stop();const nodes=[...el('steps').children];let i=0;const paint=()=>nodes.forEach((node,j)=>node.classList.toggle('active',j===i));paint();if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&nodes.length>1)timer=setInterval(()=>{i=(i+1)%nodes.length;paint()},1400)}
function render(){const [pose,title,desc,steps]=pages[page];el('portrait').src=images[pose];el('title').textContent=title;el('desc').textContent=desc;el('count').textContent=String(page+1).padStart(2,'0')+' / '+pages.length;el('steps').replaceChildren(...steps.map(s=>{const n=document.createElement('span');n.className='step';n.textContent=s;return n}));el('progress').replaceChildren(...pages.map((_,i)=>{const n=document.createElement('span');if(i<=page)n.className='done';return n}));el('prev').disabled=page===0;el('next').textContent=page===pages.length-1?'감독 생활 시작하기':'다음 단계';replay()}
function openGuide(){page=0;document.body.classList.remove('closed');guide.showModal();render()}
function closeGuide(){stop();guide.close()}
guide.addEventListener('close',()=>{stop();document.body.classList.add('closed');el('launch').focus()});el('close').onclick=closeGuide;el('skip').onclick=closeGuide;el('launch').onclick=openGuide;el('replay').onclick=replay;el('prev').onclick=()=>{if(page>0){page--;render()}};el('next').onclick=()=>{if(page===pages.length-1)closeGuide();else{page++;render()}};openGuide();
</script></body></html>
