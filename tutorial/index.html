<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELEVOS 신규 감독 가이드</title><style>
*{box-sizing:border-box}body{margin:0;background:#10151d;color:#f4f6fa;font-family:Pretendard,system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}dialog{position:relative;inset:auto;margin:0;width:min(1100px,100%);max-height:calc(100dvh - 40px);overflow:auto;border:1px solid #374252;border-radius:16px;background:#18212e;color:inherit;padding:24px;box-shadow:0 24px 80px #0008}header,footer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{letter-spacing:.16em}header small{margin-left:auto;color:#bbc5d3}.layout{display:grid;grid-template-columns:30% 1fr;gap:24px;min-height:460px;margin:20px 0}.portrait{position:relative;min-height:300px;overflow:hidden;background:radial-gradient(ellipse at center,#34475f,transparent 70%)}.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0;transition:opacity .4s ease;pointer-events:none}.portrait img.visible{opacity:1}.portrait-status{position:absolute;inset:0;display:grid;place-items:center;color:#aab8cb;font-size:14px;text-align:center;padding:12px}.portrait-status[hidden]{display:none}@media(prefers-reduced-motion:reduce){.portrait img{transition:none}}.content{display:flex;flex-direction:column;justify-content:center;min-width:0}h1{font-size:clamp(22px,3vw,32px);margin:12px 0}p{line-height:1.75;color:#c5cedb;margin:0 0 16px}.demo{border:1px solid #40506a;background:#101722;border-radius:10px;min-height:170px;padding:20px;display:grid;align-content:center;gap:10px}.demo small{color:#aab8cb}.steps{display:flex;flex-wrap:wrap;gap:8px}.step{border:1px solid #43516a;border-radius:7px;padding:10px;font-size:14px;color:#bcc6d4}.step.active{border-color:#d9bd83;color:#fff;background:#51452f}.progress{display:flex;gap:5px;margin:16px 0}.progress span{flex:1;height:4px;background:#3c4656;border-radius:4px}.progress .done{background:#d9bd83}button,a{font:inherit}button{cursor:pointer;color:inherit;background:#273345;border:1px solid #4b586b;border-radius:8px;padding:11px 16px}button:disabled{opacity:.4;cursor:default}button.primary{background:#d9bd83;color:#151a22;border-color:transparent;font-weight:700}footer .spacer{flex:1}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}#launch{display:none}body.closed #launch{display:block}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:650px){.layout{grid-template-columns:1fr;gap:10px;min-height:0}.portrait{height:200px;min-height:0}dialog{padding:16px}.demo{min-height:140px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.demo{position:relative;overflow:hidden}.steps{position:relative;padding:12px 4px 24px;min-height:80px}.step{transition:background .25s,border-color .25s,box-shadow .25s}.step.active{box-shadow:0 0 0 2px #d9bd8344}.demo-cursor{position:absolute;left:0;top:0;width:24px;height:28px;z-index:2;pointer-events:none;transition:transform .65s cubic-bezier(.2,.7,.25,1);filter:drop-shadow(0 2px 3px #0009)}.demo-cursor[hidden]{display:none}.demo-cursor svg{width:24px;height:28px;position:relative;z-index:1}.demo-cursor:after{content:"";position:absolute;left:0;top:0;width:24px;height:24px;border:2px solid #d9bd83;border-radius:50%;opacity:0}.demo-cursor.click:after{animation:clickPulse .45s ease-out}.demo-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.demo-controls small{margin-left:auto}.speech{display:grid}.speech>*{grid-area:1/1}.speech-reserve{visibility:hidden;pointer-events:none}.speech button{padding:0;border:0;background:none;color:#c5cedb;text-align:left;line-height:1.75;margin:0 0 16px;align-self:start}.content.scene-enter{animation:sceneEnter .3s ease both}@keyframes sceneEnter{from{opacity:.25;transform:translateX(8px)}to{opacity:1;transform:none}}@keyframes clickPulse{from{opacity:1;transform:scale(.5)}to{opacity:0;transform:scale(1.6)}}@media(prefers-reduced-motion:reduce){.demo-cursor,.step{transition:none!important}.demo-cursor{display:none!important}}
.welcome-panel[hidden]{display:none}.welcome-panel{position:relative;overflow:hidden;border:1px solid #48566c;border-radius:12px;padding:24px;background:radial-gradient(ellipse at 80% 0%,#293c58 0%,#131c2a 65%);min-height:170px;display:grid;align-content:center;gap:12px}.welcome-panel:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,#d9bd831c 50%,transparent 70%);transform:translateX(-100%)}.intro .welcome-panel:before{animation:welcomeSweep 1.5s .15s ease both}.welcome-mark{font-size:clamp(24px,4vw,42px);font-weight:800;letter-spacing:.18em;line-height:1.2;color:#f4f6fa}.welcome-kicker{font-size:12px;letter-spacing:.14em;color:#d9bd83;font-weight:600}.welcome-summary{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:#c5cedb}.welcome-summary span{border-left:2px solid #d9bd83;padding-left:8px}.intro .welcome-mark{animation:welcomeLogo .7s ease both}.intro .welcome-kicker,.intro .welcome-summary{animation:appear .5s .25s ease both}.intro .portrait{background:radial-gradient(ellipse at 50% 40%,#42546e 0%,transparent 72%)}.intro .portrait img.visible{filter:drop-shadow(0 12px 22px #0005)}.intro .demo{display:none}.speaker-label{font-size:12px;color:#d9bd83;font-weight:600;letter-spacing:.04em}.speech button,.speech-reserve{white-space:pre-line}.intro .scene-enter{animation:sceneEnter .5s ease both}@keyframes welcomeLogo{from{opacity:0;letter-spacing:.28em;transform:translateY(8px)}to{opacity:1;letter-spacing:.18em;transform:none}}@keyframes welcomeSweep{to{transform:translateX(100%)}}@media(max-width:650px){.welcome-panel{padding:16px;min-height:140px}.welcome-summary{font-size:12px}}
.supply-stage[hidden]{display:none}.supply-stage{position:relative;min-height:224px;border:1px solid #34445b;border-radius:9px;background:#111a27;overflow:hidden;padding:12px;display:grid;gap:10px}.supply-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#aab8cb}.supply-body{display:grid;place-items:center;min-height:168px;text-align:center}.supply-box{width:min(100%,310px);padding:12px;border:1px solid #46566d;border-radius:8px;background:#202d40;display:grid;gap:8px}.supply-box b{font-size:16px}.supply-box small{color:#aab8cb}.supply-action{display:inline-block;background:#d9bd83;color:#18212e;border-radius:5px;padding:8px 12px;font-size:13px;font-weight:700}.pack-art{width:72px;height:92px;margin:auto;display:grid;place-items:center;border:1px solid #e5c891;border-radius:6px;background:linear-gradient(145deg,#172231,#655238,#192738);font-size:11px;font-weight:800;letter-spacing:.12em;box-shadow:0 5px 16px #0006}.pack-art.opening{animation:packOpen .65s ease both}.sample-cards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.sample-card{width:72px;height:102px;border:1px solid #d9bd83;border-radius:7px;background:linear-gradient(155deg,#6b5632,#273548 60%);display:grid;align-content:center;gap:4px;color:#fff;animation:cardReveal .45s ease both}.sample-card:nth-child(2){animation-delay:.12s}.sample-card:nth-child(3){animation-delay:.24s}.sample-card strong{font-size:22px}.sample-card small{font-size:11px}.sample-card i{font-style:normal;font-size:22px}.supply-note{font-size:12px;color:#c5cedb}.supply-demo .steps{min-height:0;padding:0;gap:5px}.supply-demo .step{font-size:11px;padding:5px 8px}.supply-demo .demo-controls{margin-top:2px}@keyframes packOpen{0%{transform:scale(.8);opacity:.4}65%{transform:scale(1.12);filter:brightness(1.8)}100%{transform:none;opacity:1}}@keyframes cardReveal{from{opacity:0;transform:translateY(12px) rotateY(75deg)}to{opacity:1;transform:none}}
</style></head><body><button id="launch">가이드 다시 보기</button><dialog id="guide" aria-labelledby="title"><header><strong>ELEVOS</strong><span>신규 감독 가이드</span><small id="count"></small><button id="close" aria-label="닫기">닫기</button></header><div class="layout"><div class="portrait"><img id="portrait" alt="" aria-hidden="true"><img id="portraitAlt" alt="" aria-hidden="true"><span id="portraitStatus" class="portrait-status" role="status">안내원 준비 중</span></div><div class="content"><span class="speaker-label">구단 운영 매니저</span><h1 id="title"></h1><div class="speech"><p id="speechReserve" class="speech-reserve" aria-hidden="true"></p><button id="desc" aria-label="전체 안내 문장 보기"></button></div><section id="welcomePanel" class="welcome-panel" hidden aria-label="감독 취임 안내"><div class="welcome-kicker">WELCOME, MANAGER</div><div class="welcome-mark">ELEVOS</div><div class="welcome-summary"><span>선수단 구성</span><span>경기 및 전술</span><span>구단 성장과 대회</span></div></section><div class="demo"><small>시연 준비 화면 · 실제 게임 데이터와 무관</small><section id="supplyStage" class="supply-stage" hidden aria-label="보급품 및 카드팩 개봉 예시"><div class="supply-top"><span id="supplyMenu"></span><span>DEMO</span></div><div id="supplyBody" class="supply-body"></div></section><div class="steps" id="steps"></div><div class="demo-cursor" id="cursor" aria-hidden="true" hidden><svg viewBox="0 0 24 28"><path d="M3 2L21 18L12 19L9 26Z" fill="#fff" stroke="#141b25" stroke-width="1.6" stroke-linejoin="round"/></svg></div><div class="demo-controls"><button id="replay">다시 시연</button><button id="pause">일시정지</button><small id="sceneCount"></small></div></div></div></div><div class="progress" id="progress" aria-hidden="true"></div><footer><button id="skip">건너뛰기</button><span class="spacer"></span><button id="prev">이전</button><button class="primary" id="next">다음 단계</button></footer></dialog><script>
'use strict';
const base='https://nineworksdatabase.planus253.workers.dev/cdn/uncategorized/';
const images=['20261128-044041-11-f875d795.webp','20261128-044041-222-e2b9db92.webp','20261128-044042-333-4d1e8932.webp','20261128-044042-444-bec12d00.webp','20261128-044042-555-8aa43fad.webp'].map(x=>base+x);
const poseNames=['환영 인사','기능 소개','상세 설명','격려','마무리 인사'];
const assets=images.map(src=>{const img=new Image();let ready=new Promise(resolve=>{img.onload=()=>resolve(true);img.onerror=()=>resolve(false);img.src=src});return {img,ready}});
let portraitToken=0,activeLayer=-1,activePose=-1;
async function showPortrait(pose){
 const token=++portraitToken, layers=[el('portrait'),el('portraitAlt')], status=el('portraitStatus');
 if(activePose===pose&&activeLayer>=0){status.hidden=true;return}
 status.hidden=activeLayer>=0;
 let ok=await assets[pose].ready;
 if(token!==portraitToken||!guide.open)return;
 if(!ok){status.textContent='안내원 이미지를 불러오지 못했습니다.';status.hidden=false;layers.forEach(n=>n.classList.remove('visible'));activeLayer=-1;activePose=-1;return}
 const next=activeLayer===0?1:0,node=layers[next];
 node.src=assets[pose].img.src;
 try{if(node.decode)await node.decode()}catch{}
 if(token!==portraitToken||!guide.open)return;
 if(!node.complete||!node.naturalWidth){status.textContent='안내원 이미지를 불러오지 못했습니다.';status.hidden=false;layers.forEach(n=>n.classList.remove('visible'));activeLayer=-1;activePose=-1;return}
 node.alt='구단 운영 안내원 · '+poseNames[pose];node.removeAttribute('aria-hidden');node.classList.add('visible');
 if(activeLayer>=0){layers[activeLayer].classList.remove('visible');layers[activeLayer].setAttribute('aria-hidden','true');layers[activeLayer].alt=''}
 activeLayer=next;activePose=pose;status.hidden=true;
}
const pages=[
[0,'반갑습니다, 감독님!','새로 취임하신 감독님을 진심으로 환영합니다. 저는 감독님의 구단 운영을 도와드릴 매니저입니다.\n\n본격적인 감독 생활에 앞서 선수 영입과 선수단 구성, 경기 진행, 강화 및 다양한 대회 도전 방법을 간단히 안내해 드리겠습니다.',['감독 취임','구단 운영 가이드']],
[1,'함께할 선수들을 영입해 보세요.','먼저 선물함에서 지급된 보급품을 수령하세요. 카드팩 개봉 메뉴에서 보유한 팩을 열면 선수가 추가됩니다. 개봉한 선수는 선수단 관리에서 확인할 수 있어요.',['선물함','보급 수령','카드팩 개봉','선수 획득']],
[1,'선수단을 구성해 보세요.','선발 11명, 후보, 2군을 구성하고 포지션과 능력치를 확인하세요.',['선수 선택','선발 등록','후보 및 2군','저장']],
[1,'우리 팀만의 전술을 만들어 보세요.','포메이션과 선수 위치를 조정하고 전술을 저장하세요.',['포메이션 선택','선수 배치','저장']],
[3,'첫 경기를 시작해 볼까요?','리그에서 일반 또는 자동 경기를 진행하고 PK와 1:1 찬스에 참여하세요.',['리그 선택','경기 시작','경기 진행','보상']],
[3,'선수를 강화해 보세요.','선수와 재료를 선택하고 성공 확률과 실패 조건을 확인하세요.',['대상 선택','재료 등록','확률 확인','강화']],
[2,'선수의 잠재력을 높여 주세요.','경기 경험치와 능력치 포인트를 활용하고 특수 성장에 도전하세요.',['경험치','능력치 분배','특수 성장']],
[2,'이적시장을 활용해 보세요.','선수 검색, 구매, 판매 및 트레이드로 선수단을 보강하세요.',['검색','구매','판매','트레이드']],
[1,'필요한 아이템을 준비하세요.','상점에서 가격과 수량을 확인한 뒤 카드팩과 아이템을 구매하세요.',['상점','아이템 선택','수량 확인','구매']],
[2,'구단을 체계적으로 관리하세요.','급여와 청구서, 부상 치료를 관리하고 불필요한 선수카드를 소각하세요. 소각 전 대상을 반드시 확인하세요.',['청구서','부상 치료','소각 대상 선택','최종 확인']],
[3,'더 큰 무대에 도전해 보세요.','정규 리그 외에도 컵 대회와 월드리그가 있습니다. 대회별 참가 조건과 특별 선수카드 및 자금 보상을 확인하세요.',['대회 목록','참가 조건','우승','특별 보상']],
[4,'모든 준비가 끝났습니다, 감독님!','감독님의 성공적인 첫 시즌을 응원하겠습니다.',['감독 생활 시작']]
];
const el=id=>document.getElementById(id),guide=el('guide'),motion=matchMedia('(prefers-reduced-motion: reduce)');
let page=0,timer=null,typingTimer=null,sceneToken=0,sceneIndex=0,paused=false,speechText='';
function stopScene(){sceneToken++;clearTimeout(timer);timer=null;el('cursor').hidden=true;el('cursor').classList.remove('click')}
function finishSpeech(){clearInterval(typingTimer);typingTimer=null;el('desc').textContent=speechText}
function stop(){stopScene();finishSpeech()}
function speak(text){clearInterval(typingTimer);speechText=text;el('speechReserve').textContent=text;el('desc').setAttribute('aria-label',text+' · 클릭하면 전체 문장 표시');if(motion.matches){finishSpeech();return}const chars=Array.from(text);let i=0;el('desc').textContent='';typingTimer=setInterval(()=>{i=Math.min(i+2,chars.length);el('desc').textContent=chars.slice(0,i).join('');if(i===chars.length)finishSpeech()},35)}
function moveCursor(node){const cursor=el('cursor'),a=node.getBoundingClientRect(),b=cursor.parentElement.getBoundingClientRect();cursor.style.transform='translate('+Math.round(a.left-b.left+a.width*.65)+'px,'+Math.round(a.top-b.top+a.height*.65)+'px)'}
function supplyScene(index){const stage=el('supplyStage'),body=el('supplyBody');if(page!==1){stage.hidden=true;return}stage.hidden=false;el('supplyMenu').textContent=['선물함','선물함 · 수령 완료','카드팩 개봉','개봉 결과'][index]||'선수 영입';
const scenes=[
'<div class="supply-box"><b>신규 감독 보급품</b><small>예시 · 카드팩 10장</small><span class="supply-action">보급품 수령</span></div>',
'<div class="supply-box"><b>보급품 수령 완료</b><small>보유 카드팩 +10 (예시)</small><span class="supply-action">카드팩 개봉 메뉴로</span></div>',
'<div class="supply-box"><div class="pack-art opening">ELEVOS<br>PACK</div><small>보유 카드팩 · 예시</small><span class="supply-action">개봉하기</span></div>',
'<div><div class="sample-cards"><div class="sample-card"><strong>88</strong><i>♟</i><small>ST</small></div><div class="sample-card"><strong>84</strong><i>♟</i><small>CM</small></div><div class="sample-card"><strong>82</strong><i>♟</i><small>CB</small></div></div><div class="supply-note" style="margin-top:10px">선수 획득 완료 · 예시 카드</div></div>'
];body.innerHTML=scenes[index]||scenes[0];}
function showStep(index){supplyScene(index);const nodes=[...el('steps').children];nodes.forEach((n,j)=>n.classList.toggle('active',j===index));el('sceneCount').textContent=(index+1)+' / '+nodes.length;return nodes[index]}
function runScene(){stopScene();if(page===0)return;const token=sceneToken,nodes=[...el('steps').children];if(!nodes.length||!guide.open)return;const cursor=el('cursor');if(motion.matches||paused||document.hidden){showStep(sceneIndex);return}cursor.hidden=false;function advance(){if(token!==sceneToken||!guide.open)return;cursor.classList.remove('click');const target=page===1?el("supplyBody").querySelector(".supply-action")||nodes[sceneIndex]:nodes[sceneIndex];moveCursor(target);timer=setTimeout(()=>{if(token!==sceneToken)return;showStep(sceneIndex);cursor.classList.add('click');timer=setTimeout(()=>{if(token!==sceneToken)return;sceneIndex=(sceneIndex+1)%nodes.length;advance()},sceneIndex===nodes.length-1?2400:1400)},700)}advance()}
function replay(){paused=false;sceneIndex=0;el('pause').textContent='일시정지';showStep(0);runScene()}
function togglePause(){paused=!paused;el('pause').textContent=paused?'계속 재생':'일시정지';if(paused)stopScene();else runScene()}
function render(){stop();guide.classList.toggle('intro',page===0);el('supplyStage').hidden=page!==1;el('supplyStage').closest('.demo').classList.toggle('supply-demo',page===1);el('welcomePanel').hidden=page!==0;const [pose,title,desc,steps]=pages[page];showPortrait(pose);const content=el('title').parentElement;content.classList.remove('scene-enter');void content.offsetWidth;content.classList.add('scene-enter');el('title').textContent=title;speak(desc);el('count').textContent=String(page+1).padStart(2,'0')+' / '+pages.length;el('steps').replaceChildren(...steps.map(s=>{const n=document.createElement('span');n.className='step';n.textContent=s;return n}));el('progress').replaceChildren(...pages.map((_,i)=>{const n=document.createElement('span');if(i<=page)n.className='done';return n}));el('prev').disabled=page===0;el('next').textContent=page===pages.length-1?'감독 생활 시작하기':page===0?'구단 운영 가이드 시작하기':'다음 단계';replay();el('pause').disabled=motion.matches; if(page===0)stopScene()}
el('desc').onclick=finishSpeech;el('pause').onclick=togglePause;
motion.addEventListener('change',()=>{if(!guide.open)return;if(motion.matches)finishSpeech();el('pause').disabled=motion.matches;runScene()});
window.addEventListener('resize',()=>{if(guide.open&&!paused&&!motion.matches){const node=el('steps').children[sceneIndex];if(node)moveCursor(page===1?el('supplyBody').querySelector('.supply-action')||node:node)}});
document.addEventListener('visibilitychange',()=>{if(!guide.open)return;if(document.hidden){stopScene();finishSpeech()}else if(!paused)runScene()});
function openGuide(){page=0;document.body.classList.remove('closed');guide.showModal();render()}
function closeGuide(){stop();guide.close()}
guide.addEventListener('close',()=>{portraitToken++;stop();document.body.classList.add('closed');el('launch').focus()});el('close').onclick=closeGuide;el('skip').onclick=closeGuide;el('launch').onclick=openGuide;el('replay').onclick=replay;el('prev').onclick=()=>{if(page>0){page--;render()}};el('next').onclick=()=>{if(page===pages.length-1)closeGuide();else{page++;render()}};openGuide();
</script></body></html>
