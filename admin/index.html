<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELEVOS 관리자</title><style>*{box-sizing:border-box}body{margin:0;background:#151715;color:#eee;font:14px Pretendard,system-ui,sans-serif}header{background:#111;padding:20px 5%;display:flex;align-items:center;gap:20px;border-bottom:1px solid #30352e}header strong{font-size:25px;font-style:italic}header a{margin-left:auto;color:#ddd}main{max-width:1440px;margin:40px auto;padding:0 5%}h1{font-size:27px}p{color:#b9bcb6;line-height:1.6}section{background:#20241f;border:1px solid #343932;border-radius:8px;padding:24px;margin:20px 0}#login{max-width:440px;margin:60px auto}label{display:block;margin:14px 0 6px}input,button{font:inherit;padding:12px;border-radius:5px;border:1px solid #454a42;background:#171a16;color:#eee}#login input{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.primary{background:#dfc58b;color:#161815;border:0;font-weight:700}#login button{width:100%;margin-top:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{padding:20px;background:#242922;border-radius:6px}.stat strong{display:block;font-size:30px;margin-top:10px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;padding:15px 12px;border-bottom:1px solid #343932}th{color:#b9bcb6;font-size:12px}td{font-size:13px}.gold{color:#dfc58b}#status{min-height:24px;color:#dfc58b} [hidden]{display:none!important}</style></head><body><header><strong>ELEVOS</strong><span class="gold">ADMIN</span><a href="../">공식 홈페이지</a></header><main><section id="login" hidden><h1>관리자 로그인</h1><p>관리자 권한이 부여된 Firebase 계정으로 접속하세요.</p><form id="form"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">로그인</button></form></section><p id="status" role="status">인증 확인 중...</p><button id="logout" hidden>로그아웃</button><div id="dashboard" hidden><h1>가입자 관리</h1><p>Firebase Authentication · 읽기 전용</p><div class="stats"><div class="stat">조회된 가입자<strong id="total">0</strong></div><div class="stat">오늘 가입 (KST)<strong id="today">0</strong></div><div class="stat">활성 계정<strong id="active">0</strong></div></div><section><div class="toolbar"><h2>가입자 목록</h2><div><input id="search" type="search" placeholder="이메일, 아이디, UID 검색" aria-label="가입자 검색"><button id="refresh">새로고침</button></div></div><div class="scroll"><table><thead><tr><th>이메일</th><th>아이디 / 표시명</th><th>가입일</th><th>최종 로그인</th><th>상태</th><th>UID</th></tr></thead><tbody id="rows"></tbody></table></div><p id="count"></p><button id="more" hidden>다음 100명 불러오기</button></section></div></main><script src="../firebase-config.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,setPersistence,browserSessionPersistence}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';import{getFunctions,httpsCallable}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-functions.js';const $=id=>document.getElementById(id);const app=initializeApp(window.ELEVOS_FIREBASE_CONFIG,'elevos-admin');const auth=getAuth(app);const call=httpsCallable(getFunctions(app,'asia-northeast3'),'adminListMembers');let members=[],cursor=null,epoch=0,busy=false;const msg=t=>$('status').textContent=t;const day=d=>d&&Number.isFinite(Date.parse(d))?new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d)):'';const date=d=>day(d)?new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',dateStyle:'medium',timeStyle:'short'}).format(new Date(d)):'—';function clear(){members=[];cursor=null;$('rows').replaceChildren();$('dashboard').hidden=true;$('more').hidden=true;$('search').value=''}function render(){const q=$('search').value.trim().toLowerCase();const list=members.filter(u=>[u.email,u.name,u.uid].some(v=>String(v||'').toLowerCase().includes(q))).sort((a,b)=>Date.parse(b.createdAt)-Date.parse(a.createdAt));$('rows').replaceChildren();for(const u of list){const tr=document.createElement('tr');for(const v of [u.email||'—',u.name||'—',date(u.createdAt),date(u.lastSignInAt),u.disabled?'비활성':'활성',u.uid]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr)}$('total').textContent=members.length;$('today').textContent=members.filter(u=>day(u.createdAt)===day(new Date())).length;$('active').textContent=members.filter(u=>!u.disabled).length;$('count').textContent='검색 결과 '+list.length+'명 · '+(cursor?'추가 페이지 있음':'조회 완료');$('more').hidden=!cursor}async function load(reset){if(busy)return;busy=true;const e=epoch;msg('가입자 조회 중...');try{const result=await call({pageToken:reset?null:cursor});if(e!==epoch)return;members=reset?result.data.members:[...members,...result.data.members];cursor=result.data.nextPageToken;$('dashboard').hidden=false;render();msg('가입자 조회 완료')}catch(err){if(e!==epoch)return;clear();msg(err.code==='functions/permission-denied'?'관리자 권한이 없습니다.': '조회 실패: 관리자 함수 배포 및 권한 설정을 확인하세요.')}finally{busy=false;if(e!==epoch&&auth.currentUser)load(true)}}$('form').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{await setPersistence(auth,browserSessionPersistence);await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch{msg('로그인 실패. 계정 정보를 확인하세요.')}finally{b.disabled=false}});$('logout').onclick=()=>signOut(auth);$('refresh').onclick=()=>load(true);$('more').onclick=()=>load(false);$('search').oninput=render;onAuthStateChanged(auth,u=>{epoch++;clear();$('login').hidden=!!u;$('logout').hidden=!u;if(u)load(true);else msg('관리자 계정으로 로그인하세요.')});</script></body></html>
