function viewSquad(){let arr=myPlayers().sort((a,b)=>overall(b)-overall(a));if(selectedPlayer===null||!arr.some(p=>p.id===selectedPlayer))selectedPlayer=arr[0].id;let p=players.find(x=>x.id===selectedPlayer);return '<div class="grid two"><section class="card"><h2>선수단</h2><div class="tablewrap"><table><thead><tr><th>선수명</th><th>포지션</th><th>나이</th><th>능력</th><th>LV</th></tr></thead><tbody>'+arr.map(x=>'<tr onclick="selectPlayer('+x.id+')" style="cursor:pointer;'+(x.id===p.id?'background:#25392b':'')+'"><td><div style="display:flex;align-items:center;gap:9px">'+avatar(x,34)+'<span>'+txt(x.name)+'</span></div></td><td>'+x.pos+'</td><td>'+x.age+'</td><td>'+overall(x)+'</td><td>'+x.level+'</td></tr>').join('')+'</tbody></table></div></section><section class="card"><div class="eyebrow">PLAYER DEVELOPMENT</div><div class="row" style="margin-top:10px"><div style="display:flex;align-items:center;gap:13px">'+avatar(p,74)+'<div><h2>'+txt(p.name)+'</h2><div class="muted small">'+p.pos+' · '+p.age+'세 · LV.'+p.level+'</div></div></div><div class="value">'+overall(p)+'</div></div><div class="row" style="margin:15px 0"><span class="muted small">경험치 '+p.xp+'/100 XP</span><span class="tag">육성 '+p.pts+' PT</span></div><div class="bar"><i style="width:'+p.xp+'%"></i></div><div style="margin-top:17px">'+Object.entries({pace:'속력',shoot:'슈팅',pass:'패스',defend:'수비',physical:'피지컬'}).map(([key,label])=>'<div class="stat"><label>'+label+'</label><div class="bar"><i style="width:'+p.stats[key]+'%"></i></div><strong>'+p.stats[key]+'</strong><button class="btn mini" '+(p.pts<=0||p.stats[key]>=99?'disabled':'')+' onclick="upgrade(\''+key+'\')">+1</button></div>').join('')+'</div><p class="muted small">레벨업마다 3PT 지급 · 능력치 최대 99</p></section></div>'}

function goals(power){let x=0,lambda=Math.max(.2,Math.min(3.1,1.25+power/29)),threshold=Math.exp(-lambda),p=1;do{x++;p*=rnd()}while(p>threshold&&x<9);return x-1}
function playRound(){if(round>=22)return;let ownMatch=null;for(let li=0;li<LEAGUES.length;li++)for(let [a,b] of fixtures[li][round]){let A=clubs[a],B=clubs[b];let av=teamPower(a),bv=teamPower(b);let tactA=a===manager?tacticModifier():0,tactB=b===manager?tacticModifier():0;let ta=goals((av-bv)*1.45+3+tactA),tb=goals((bv-av)*1.45-3+tactB);let pa=points[a],pb=points[b];pa.p++;pb.p++;pa.gf+=ta;pa.ga+=tb;pb.gf+=tb;pb.ga+=ta;if(ta>tb){pa.w++;pb.l++}else if(ta<tb){pb.w++;pa.l++}else{pa.d++;pb.d++}if(a===manager||b===manager){ownMatch=A.name+' '+ta+' : '+tb+' '+B.name;let starters=new Set(currentLineup().filter(x=>x!==null));for(let p of myPlayers()){let gain=starters.has(p.id)?rand(18,36):rand(0,4);p.xp+=gain;while(p.xp>=100){p.xp-=100;if(p.level<50){p.level++;p.pts+=3}}}}}round++;matchLog=ownMatch+' · 출전 선수 경험치 반영 완료';if(round===22){finishSeason();matchLog+=' · 시즌 종료, 승격·강등 반영'}save();render()}

function viewMarket(){if(manager===null)return viewStart();let c=own(),candidates=players.filter(p=>p.club!==manager).sort((a,b)=>overall(b)-overall(a)).slice(0,60),opts=candidates.slice(0,20);return '<section class="card"><h2>이적시장</h2><p class="muted small">타 구단 선수를 영입할 수 있습니다. 능력치 기반 이적료가 차감되고 선수 소속이 변경됩니다. 첫 버전은 간단 영입 기능입니다.</p><div class="tablewrap"><table><thead><tr><th>선수</th><th>소속</th><th>포지션</th><th>능력</th><th>이적료</th><th></th></tr></thead><tbody>'+opts.map(p=>{let fee=Math.max(1,Math.round((overall(p)-50)*1.2))*1000000;return '<tr><td><div style="display:flex;align-items:center;gap:9px">'+avatar(p,32)+'<span>'+txt(p.name)+'</span></div></td><td>'+clubs[p.club].name+'</td><td>'+p.pos+'</td><td>'+overall(p)+'</td><td>'+Math.round(fee/1000000)+'M</td><td><button class="btn mini" '+(c.cash<fee?'disabled':'')+' onclick="buy('+p.id+','+fee+')">영입</button></td></tr>'}).join('')+'</tbody></table></div></section>'}

let lineups=(saved&&saved.lineups)||{};
function detailed(p){if(p.detail)return p.detail;const s=p.stats;const noise=(n)=>(((p.id*41+n*97)>>>0)%13)-6;const clamp=x=>Math.max(25,Math.min(95,Math.round(x)));p.detail={
 acceleration:clamp(s.pace+noise(1)),sprint:clamp(s.pace+noise(2)),finishing:clamp(s.shoot+noise(3)),shotPower:clamp(s.shoot+noise(4)),positioning:clamp(s.shoot+noise(5)),shortPass:clamp(s.pass+noise(6)),longPass:clamp(s.pass+noise(7)),vision:clamp(s.pass+noise(8)),dribble:clamp((s.pace+s.pass)/2+noise(9)),firstTouch:clamp(s.pass+noise(10)),tackle:clamp(s.defend+noise(11)),interception:clamp(s.defend+noise(12)),marking:clamp(s.defend+noise(13)),stamina:clamp(s.physical+noise(14)),strength:clamp(s.physical+noise(15)),reflex:clamp(s.defend+noise(16)),handling:clamp(s.defend+noise(17)),gkPosition:clamp(s.defend+noise(18))};return p.detail}
function overall(p){let d=detailed(p);let keys=OVR_KEYS[p.pos]||OVR_KEYS.CM;return Math.round(keys.reduce((sum,k)=>sum+d[k],0)/keys.length)}
function positionFit(p,role){if(p.pos===role)return 1;if(ROLE_FAMILY[p.pos]===ROLE_FAMILY[role])return .88;if((ROLE_FAMILY[p.pos]==='FW'&&ROLE_FAMILY[role]==='MF')||(ROLE_FAMILY[p.pos]==='MF'&&ROLE_FAMILY[role]==='FW'))return .7;return .48}

function currentLineup(){if(manager===null)return[];let key=manager+':'+formation;if(!lineups[key]||lineups[key].length!==11)lineups[key]=initLineup(formation);let used=new Set();lineups[key]=lineups[key].map(id=>{if(id===null||used.has(id)||!players.some(p=>p.id===id&&p.club===manager))return null;used.add(id);return id});return lineups[key]}
function effectiveLineupPower(clubId){if(clubId===manager){const selected=currentLineup(),slots=FORMATIONS[formation];let total=0,filled=0;for(let i=0;i<11;i++){const p=players.find(x=>x.id===selected[i]);if(p){total+=overall(p)*positionFit(p,slots[i].r);filled++}}return filled?total/11:30}return players.filter(p=>p.club===clubId).sort((a,b)=>overall(b)-overall(a)).slice(0,11).reduce((sum,p)=>sum+overall(p),0)/11}
function teamPower(clubId){return clubs[clubId].rating*.27+effectiveLineupPower(clubId)*.73}

function playRound(){
 if(round>=22||manager===null)return;
 if(pendingReward?.club===manager){matchTab='rewards';page='match';render();return}
 const y=season,week=round,club=own(),myPair=matchPair(),starting=currentLineup().slice(),lineup=starting.map(id=>players.find(p=>p.id===id)),entry=[];
 let ownScore=null;
 for(let li=0;li<LEAGUES.length;li++){
  const recorded=[];
  for(let [a,b] of fixtures[li][week]){
   const A=clubs[a],B=clubs[b],av=teamPower(a),bv=teamPower(b);
   const ta=a===manager?tacticModifier():0,tb=b===manager?tacticModifier():0;
   let gA=goals((av-bv)*1.45+3+ta),gB=goals((bv-av)*1.45-3+tb);
   recorded.push([gA,gB]);
   const pa=points[a],pb=points[b];pa.p++;pb.p++;pa.gf+=gA;pa.ga+=gB;pb.gf+=gB;pb.ga+=gA;
   if(gA>gB){pa.w++;pb.l++}else if(gA<gB){pb.w++;pa.l++}else{pa.d++;pb.d++}
   if(a===manager||b===manager)ownScore={home:a,away:b,homeGoals:gA,awayGoals:gB};
  }
  matchResults[fixtureKey(y,li,week)]=recorded;
 }
 const lineupOut=[],starterSet=new Set(starting),isWin=ownScore&&(manager===ownScore.home?ownScore.homeGoals>ownScore.awayGoals:ownScore.awayGoals>ownScore.homeGoals),isDraw=ownScore&&ownScore.homeGoals===ownScore.awayGoals;
 let totalXP=0;
 for(const p of myPlayers()){
  const isStarter=starterSet.has(p.id);
  const xp=isStarter?rand(18,36):rand(0,4);
  p.xp+=xp;if(isStarter){totalXP+=xp;lineupOut.push({id:p.id,rating:matchRating(p,rand(-6,8)/10),xp})}
  while(p.xp>=100){p.xp-=100;if(p.level<50){p.level++;p.pts+=3}}
 }
 const money=(isWin?2.5:isDraw?1.3:.7),pts=isWin?3:isDraw?1:0;
 club.cash+=money*1000000;
 lastMatch={club:manager,season:y,round:week,home:ownScore.home,away:ownScore.away,homeGoals:ownScore.homeGoals,awayGoals:ownScore.awayGoals,formation,lineup:lineupOut,money,totalXP,outcome:isWin?'승리':isDraw?'무승부':'패배',leaguePts:pts};
 round++;scheduleRound=Math.min(round,21);matchTab='result';pendingReward={club:manager,season:y,round:week};
 if(round>=22){finishSeason();scheduleRound=0}
 save();page='match';render()
}

let displayLanguage=localStorage.getItem('elevos-name-language')==='en'?'en':'ko';
function playerKorean(en){
 const parts=String(en||'').trim().split(/\s+/);
 if(parts.length===2)return (PLAYER_FIRST_KO[parts[0]]||parts[0])+' '+(PLAYER_LAST_KO[parts[1]]||parts[1]);
 return parts.map(p=>PLAYER_FIRST_KO[p]||PLAYER_LAST_KO[p]||p).join(' ');
}
function updateDisplayLanguage(lang){
 displayLanguage=lang==='en'?'en':'ko';
 localStorage.setItem('elevos-name-language',displayLanguage);
 for(let i=0;i<LEAGUES.length;i++){
  const l=LEAGUES[i];
  if(!l.nameEn)l.nameEn=l[1];
  l[1]=displayLanguage==='ko'?LEAGUE_NAMES_KO[i]:l.nameEn;
 }
 for(const c of clubs){
  if(!c.nameEn)c.nameEn=c.name;
  const canonical=LEAGUES[c.league]?.[3]?.includes(c.nameEn)?c.nameEn:c.nameEn;
  // Club ID is stable even after transfers and promotion.
  const localeClub=CLUB_NAMES_KO[Math.floor(c.id/12)]?.[c.id%12];
  c.name=displayLanguage==='ko'?(localeClub||canonical):canonical;
 }
 for(const p of players){
  if(!p.nameEn)p.nameEn=p.name;
  p.name=displayLanguage==='ko'?playerKorean(p.nameEn):p.nameEn;
 }
}
function nameLanguageSettings(){
 return '<button class="name-lang-button" onclick="toggleDisplayLanguage()" title="구단·선수 이름 언어 변경">이름 표시: '+(displayLanguage==='ko'?'한국어':'English')+'</button>';
}
function toggleDisplayLanguage(){
 updateDisplayLanguage(displayLanguage==='ko'?'en':'ko');save();render();
}
window.toggleDisplayLanguage=toggleDisplayLanguage;

/* Squad and transfer cards. Same original growth and purchase logic. */
let marketPosition='ALL',marketSearch='';
function viewSquad(){
 if(manager===null)return viewStart();
 const squad=myPlayers().slice().sort((a,b)=>overall(b)-overall(a));

 if(selectedPlayer===null||!squad.some(p=>p.id===selectedPlayer))selectedPlayer=squad[0].id;

 const roster='<section class="card"><div class="row"><div><div class="eyebrow">MY SQUAD</div><h2 style="margin:6px 0">선수단 · '+squad.length+'명</h2></div><span class="tag">선수를 선택하세요</span></div><div class="player-grid">'+squad.map(x=>'<button class="player-card '+(x.id===selectedPlayer?'active':'')+'" onclick="selectPlayer('+x.id+')">'+avatar(x,65)+'<span><strong>'+txt(x.name)+'</strong><small>'+x.pos+' · LV.'+x.level+'</small><span class="ovr">'+overall(x)+'</span></span></button>').join('')+'</div></section>';
 const profile='<section class="card"><div class="eyebrow">PLAYER DEVELOPMENT</div><div class="player-profile">'+avatar(p,108)+'<div><h2>'+txt(p.name)+'</h2><p class="muted small">'+p.pos+' · '+p.age+'세 · LV.'+p.level+'</p><span class="tag">잔여 '+p.pts+' PT</span></div><div class="player-profile-ovr">'+overall(p)+'</div></div>'+
 '<div class="profile-stats"><span>국적<b>'+txt(p.nationality)+'</b></span><span>주발<b>'+txt(p.foot)+'</b></span><span>신체<b>'+p.height+'cm · '+p.weight+'kg</b></span><span>경험치<b>'+p.xp+' / 100 XP</b></span></div>'+
 '<p class="muted small">능력치 상한 120 · 레벨업 시 3포인트 · 원하는 스탯을 +1씩 올리세요.</p><div class="player-profile-list">'+Object.entries(ATTRIBUTE_GROUPS).map(([group,attrs])=>'<div class="statgroup">'+group+'</div>'+attrs.map(([key,label])=>'<div class="player-stat-row"><span>'+label+'</span><div class="bar"><i style="width:'+Math.min(100,d[key]/120*100)+'%"></i></div><strong>'+d[key]+'</strong><button class="btn mini" '+(p.pts<=0||d[key]>=120?'disabled':'')+' onclick="upgrade(\''+key+'\')">+1</button></div>').join('')).join('')+'</div></section>';
 return '<div class="player-screen">'+roster+profile+'</div>';

function setMarketPosition(v){marketPosition=v;render()}
function applyMarketSearch(){marketSearch=(document.getElementById('market-query')?.value||'').trim().toLowerCase();render()}
function viewMarket(){
 if(manager===null)return viewStart();
 const candidates=players.filter(p=>p.club!==manager&&(marketPosition==='ALL'||p.pos===marketPosition)&&(!marketSearch||p.name.toLowerCase().includes(marketSearch)||(p.nameEn||'').toLowerCase().includes(marketSearch)))
 .sort((a,b)=>overall(b)-overall(a)).slice(0,24);
 return '<section class="card"><div class="row"><div><div class="eyebrow">TRANSFER MARKET</div><h2 style="margin:6px 0">이적시장</h2></div><span class="tag">보유 예산 '+Math.round(own().cash/1000000)+'M</span></div><p class="muted small">필요한 포지션의 선수를 찾아 팀을 강화하세요. 선택한 선수의 이름과 능력치는 이적 후에도 유지됩니다.</p>'+
 '<div class="transfer-toolbar"><input id="market-query" placeholder="선수 이름 검색" value="'+txt(marketSearch).replaceAll('"','&quot;')+'" onkeydown="if(event.key===\'Enter\')applyMarketSearch()"><select onchange="setMarketPosition(this.value)">'+['ALL','GK','CB','RB','LB','CDM','CM','CAM','LW','RW','ST'].map(x=>'<option value="'+x+'" '+(marketPosition===x?'selected':'')+'>'+(x==='ALL'?'전체 포지션':x)+'</option>').join('')+'</select><button class="btn" onclick="applyMarketSearch()">검색</button></div>'+
 '<div class="transfer-grid">'+candidates.map(p=>{const fee=Math.max(1,Math.round((overall(p)-50)*1.2))*1000000;return '<article class="transfer-card"><div class="transfer-face">'+avatar(p,78)+'<div style="min-width:0"><strong>'+txt(p.name)+'</strong><small>'+p.pos+' · '+p.age+'세</small><small>능력치 '+overall(p)+'</small></div></div><div class="transfer-club">'+shield(clubs[p.club])+'<span>'+txt(clubs[p.club].name)+'</span></div><div class="row"><strong>이적료 '+Math.round(fee/1000000)+'M</strong><button class="btn mini" '+(fee>own().cash?'disabled':'')+' onclick="buy('+p.id+','+fee+')">'+(fee>own().cash?'예산 부족':'영입')+'</button></div></article>'}).join('')+'</div>'+
 (candidates.length?'':'<div class="notice">검색 조건에 맞는 선수가 없습니다.</div>')+'</section>'
}
