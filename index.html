function own(){return clubs.find(c=>c.id===manager)}function myPlayers(){return players.filter(p=>p.club===manager)}function overall(p){const s=p.stats;let weights=p.pos==='GK'?{pace:.08,shoot:.02,pass:.20,defend:.48,physical:.22}:p.pos==='ST'?{pace:.2,shoot:.45,pass:.1,defend:.04,physical:.21}:p.pos==='CB'||p.pos==='LB'||p.pos==='RB'?{pace:.17,shoot:.04,pass:.13,defend:.43,physical:.23}:{pace:.18,shoot:.17,pass:.36,defend:.12,physical:.17};return Math.round(Object.entries(weights).reduce((a,[k,v])=>a+s[k]*v,0))}

function nextOpponent(){if(round>=22)return '시즌 종료';let match=fixtures[own().league][round].find(a=>a.includes(manager));if(!match)return '경기 없음';return clubs[match[0]].name+' <span class="muted">VS</span> '+clubs[match[1]].name}
function avatar(p,size=42){const seed=(p.id*2654435761)>>>0;const tones=['#f3cba8','#dca77e','#b97b55','#87573e','#563829'];const hairColors=['#1e2322','#493225','#7b5433','#302b2c','#5c4937'];const skin=tones[seed%tones.length],hair=hairColors[(seed>>>4)%hairColors.length],style=(seed>>>9)%5;const c=clubs[p.club]||clubs[0];const bg=['#304b42','#40534f','#3c4c58','#504a46'][((seed>>>13)%4)];let hairPath=['<path d="M20 30 Q15 10 40 10 Q66 9 60 31 L56 24 Q40 16 23 27Z"/>','<path d="M18 31 Q16 8 39 9 Q66 9 62 31 Q56 18 48 21 Q35 15 21 30Z"/>','<path d="M18 30 Q13 17 24 13 Q32 5 40 12 Q53 5 61 18 L62 31 Q57 25 54 21 L25 24Z"/>','<path d="M21 27 Q20 14 40 14 Q60 14 59 27 L55 25 Q39 21 25 27Z"/>','<path d="M18 30 Q14 12 30 11 Q38 5 44 12 Q60 8 62 29 L57 28 L54 20 L25 23Z"/>'][style];return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 80 80" role="img" aria-label="가상 선수 아바타" style="flex:none;border-radius:9px;overflow:hidden"><rect width="80" height="80" fill="'+bg+'"/><path d="M2 80 Q5 63 29 58 L51 58 Q75 63 78 80Z" fill="'+c.color+'"/><path d="M33 51H47V64Q40 71 33 64Z" fill="'+skin+'"/><ellipse cx="40" cy="35" rx="20" ry="25" fill="'+skin+'"/><g fill="'+hair+'">'+hairPath+'</g><path d="M28 36h7m10 0h7" stroke="#302823" stroke-width="1.7" stroke-linecap="round"/><path d="M39 38l-2 9h5" stroke="#775640" stroke-width="1.3" fill="none" stroke-linecap="round"/><path d="M34 53q6 3 12 0" stroke="#754a43" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>'}
function viewSquad(){let arr=myPlayers().sort((a,b)=>overall(b)-overall(a));if(selectedPlayer===null||!arr.some(p=>p.id===selectedPlayer))selectedPlayer=arr[0].id;let p=players.find(x=>x.id===selectedPlayer);return '<div class="grid two"><section class="card"><h2>선수단</h2><div class="tablewrap"><table><thead><tr><th>선수명</th><th>포지션</th><th>나이</th><th>능력</th><th>LV</th></tr></thead><tbody>'+arr.map(x=>'<tr onclick="selectPlayer('+x.id+')" style="cursor:pointer;'+(x.id===p.id?'background:#25392b':'')+'"><td><div style="display:flex;align-items:center;gap:9px">'+avatar(x,34)+'<span>'+txt(x.name)+'</span></div></td><td>'+x.pos+'</td><td>'+x.age+'</td><td>'+overall(x)+'</td><td>'+x.level+'</td></tr>').join('')+'</tbody></table></div></section><section class="card"><div class="eyebrow">PLAYER DEVELOPMENT</div><div class="row" style="margin-top:10px"><div style="display:flex;align-items:center;gap:13px">'+avatar(p,74)+'<div><h2>'+txt(p.name)+'</h2><div class="muted small">'+p.pos+' · '+p.age+'세 · LV.'+p.level+'</div></div></div><div class="value">'+overall(p)+'</div></div><div class="row" style="margin:15px 0"><span class="muted small">경험치 '+p.xp+'/100 XP</span><span class="tag">육성 '+p.pts+' PT</span></div><div class="bar"><i style="width:'+p.xp+'%"></i></div><div style="margin-top:17px">'+Object.entries({pace:'속력',shoot:'슈팅',pass:'패스',defend:'수비',physical:'피지컬'}).map(([key,label])=>'<div class="stat"><label>'+label+'</label><div class="bar"><i style="width:'+p.stats[key]+'%"></i></div><strong>'+p.stats[key]+'</strong><button class="btn mini" '+(p.pts<=0||p.stats[key]>=99?'disabled':'')+' onclick="upgrade(\''+key+'\')">+1</button></div>').join('')+'</div><p class="muted small">레벨업마다 3PT 지급 · 능력치 최대 99</p></section></div>'}
function selectPlayer(id){selectedPlayer=id;render()}function upgrade(key){let p=players.find(x=>x.id===selectedPlayer);if(p.pts<=0||p.stats[key]>=99)return;p.pts--;p.stats[key]++;save();render()}
const positions={433:[[50,90],[15,73],[38,73],[62,73],[85,73],[22,49],[50,52],[78,49],[22,25],[50,16],[78,25]],4231:[[50,90],[15,73],[38,73],[62,73],[85,73],[37,56],[63,56],[19,35],[50,37],[81,35],[50,13]],442:[[50,90],[15,73],[38,73],[62,73],[85,73],[15,45],[38,46],[62,46],[85,45],[38,17],[62,17]]};
function viewTactics(){return '<div class="grid two"><section class="card"><h2>포메이션</h2><div class="chips">'+['433','4231','442'].map(x=>'<button class="chip '+(formation===x?'on':'')+'" onclick="setFormation(\''+x+'\')">'+({433:'4-3-3',4231:'4-2-3-1',442:'4-4-2'}[x])+'</button>').join('')+'</div><div class="pitch"><div class="half"></div>'+positions[formation].map((x,i)=>'<div class="playerdot" style="left:'+x[0]+'%;top:'+x[1]+'%">'+(i+1)+'</div>').join('')+'</div></section><section class="card"><h2>팀 운영</h2><div class="setting"><label>경기 운영</label><select onchange="setTactic(this.value)"><option value="balanced" '+(tactic==='balanced'?'selected':'')+'>균형</option><option value="attack" '+(tactic==='attack'?'selected':'')+'>공격적</option><option value="defend" '+(tactic==='defend'?'selected':'')+'>수비적</option></select></div><div class="setting"><label>압박 강도 <span id="pressnum">'+pressure+'</span></label><input type="range" min="10" max="90" step="5" value="'+pressure+'" oninput="setPressure(this.value)"/></div><p class="muted small">전술 설정은 내 구단의 경기력 계산에 반영됩니다. 실제 선수의 경기 영상을 재현하지 않습니다.</p><button class="btn" onclick="go(\'match\')">경기 준비 완료</button></section></div>'}
function setFormation(x){formation=x;save();render()}function setTactic(x){tactic=x;save();render()}function setPressure(v){pressure=+v;document.getElementById('pressnum').textContent=v;save()}
function viewMatch(){return '<section class="card"><div class="eyebrow">MATCH CENTRE · ROUND '+(round+1)+'</div><h2 style="margin:12px 0">'+nextOpponent()+'</h2><p class="muted small">경기 결과는 팀 전력, 선수 평균 능력치와 전술 설정을 참고해 계산합니다. 현재는 텍스트 기반 경기 시뮬레이션입니다.</p><button class="btn" '+(round>=22?'disabled':'')+' onclick="playRound()">경기 진행</button>'+(matchLog?'<div style="margin-top:20px" class="notice">'+matchLog+'</div>':'')+'</section><section class="card"><h2>리그 일정 진행</h2><p class="muted small">매 경기 진행 시 동일 라운드의 다른 구단 경기 결과도 계산되며, 순위표와 선수 경험치가 갱신됩니다.</p><button class="btn sub" onclick="go(\'league\')">리그 순위 확인</button></section>'}
function goals(power){let x=0,lambda=Math.max(.2,Math.min(3.1,1.25+power/29)),threshold=Math.exp(-lambda),p=1;do{x++;p*=rnd()}while(p>threshold&&x<9);return x-1}
function playRound(){if(round>=22)return;let ownMatch=null,bonus={};for(let li=0;li<LEAGUES.length;li++)for(let [a,b] of fixtures[li][round]){let A=clubs[a],B=clubs[b],av=(players.filter(p=>p.club===a).reduce((s,p)=>s+overall(p),0)/23),bv=(players.filter(p=>p.club===b).reduce((s,p)=>s+overall(p),0)/23);let tact=a===manager?(tactic==='attack'?3:tactic==='defend'?-1:1)+(pressure-50)/20:0;let ta=goals((A.rating-B.rating)*.65+(av-bv)*.5+3+tact),tb=goals((B.rating-A.rating)*.65+(bv-av)*.5-3-tact);let pa=points[a],pb=points[b];pa.p++;pb.p++;pa.gf+=ta;pa.ga+=tb;pb.gf+=tb;pb.ga+=ta;if(ta>tb){pa.w++;pb.l++}else if(ta<tb){pb.w++;pa.l++}else{pa.d++;pb.d++}if(a===manager||b===manager)ownMatch=A.name+' '+ta+' : '+tb+' '+B.name}
for(let p of myPlayers()){let gain=rand(12,31);p.xp+=gain;while(p.xp>=100){p.xp-=100;p.level++;p.pts+=3}}
round++;matchLog=ownMatch+' · 경험치 획득 완료';if(round===22){finishSeason();matchLog+=' · 시즌 종료, 승격·강등 반영'}save();render()}
function finishSeason(){let changes=[];for(let [hi,lo] of [[0,1],[2,3],[4,5],[6,7]]){let upper=standing(hi),lower=standing(lo),down=upper.slice(-2),up=lower.slice(0,2);for(let c of down)c.league=lo;for(let c of up)c.league=hi;changes.push(...up.map(c=>c.name))}season++;round=0;for(let c of clubs)points[c.id]={p:0,w:0,d:0,l:0,gf:0,ga:0};for(let i=0;i<LEAGUES.length;i++)fixtures[i]=schedule(clubs.filter(c=>c.league===i).map(c=>c.id));for(let p of players)p.age++;selectedLeague=own().league}
function viewLeague(){let c=manager?own():null;let chosen=c&&selectedLeague===0?c.league:selectedLeague;return '<section class="card"><h2>리그 순위</h2>'+leaguesChips()+'<div class="row"><h3>'+LEAGUES[selectedLeague][1]+'</h3><span class="muted small">상위 2팀 승격 / 하위 2팀 강등 (4개국만)</span></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>순위</th><th>구단</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득실</th><th>승점</th></tr></thead><tbody>'+standing(selectedLeague).map((c,i)=>{let p=points[c.id];return '<tr style="'+(c.id===manager?'background:#263e2e':'')+'"><td>'+(i+1)+'</td><td>'+c.name+'</td><td>'+p.p+'</td><td>'+p.w+'</td><td>'+p.d+'</td><td>'+p.l+'</td><td>'+((p.gf-p.ga)>0?'+':'')+(p.gf-p.ga)+'</td><td><strong>'+(p.w*3+p.d)+'</strong></td></tr>'}).join('')+'</tbody></table></div></section>'}
function viewMarket(){if(!manager)return viewStart();let c=own(),candidates=players.filter(p=>p.club!==manager).sort((a,b)=>overall(b)-overall(a)).slice(0,60),opts=candidates.slice(0,20);return '<section class="card"><h2>이적시장</h2><p class="muted small">타 구단 선수를 영입할 수 있습니다. 능력치 기반 이적료가 차감되고 선수 소속이 변경됩니다. 첫 버전은 간단 영입 기능입니다.</p><div class="tablewrap"><table><thead><tr><th>선수</th><th>소속</th><th>포지션</th><th>능력</th><th>이적료</th><th></th></tr></thead><tbody>'+opts.map(p=>{let fee=Math.max(1,Math.round((overall(p)-50)*1.2))*1000000;return '<tr><td><div style="display:flex;align-items:center;gap:9px">'+avatar(p,32)+'<span>'+txt(p.name)+'</span></div></td><td>'+clubs[p.club].name+'</td><td>'+p.pos+'</td><td>'+overall(p)+'</td><td>'+Math.round(fee/1000000)+'M</td><td><button class="btn mini" '+(c.cash<fee?'disabled':'')+' onclick="buy('+p.id+','+fee+')">영입</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function buy(id,fee){let p=players.find(p=>p.id===id);if(!p||own().cash<fee)return;if(myPlayers().length>=30){alert('선수단 최대 인원은 30명입니다.');return}let seller=clubs[p.club];own().cash-=fee;seller.cash+=fee;p.club=manager;save();render()}
window.go=go;window.chooseLeague=chooseLeague;window.chooseClub=chooseClub;window.selectPlayer=selectPlayer;window.upgrade=upgrade;window.setFormation=setFormation;window.setTactic=setTactic;window.setPressure=setPressure;window.playRound=playRound;window.buy=buy;
render();
</script></body></html>
