function viewMatch(){return '<section class="card"><div class="eyebrow">MATCH CENTRE · ROUND '+(round+1)+'</div><h2 style="margin:12px 0">'+nextOpponent()+'</h2><p class="muted small">경기 결과는 팀 전력, 선수 평균 능력치와 전술 설정을 참고해 계산합니다. 현재는 텍스트 기반 경기 시뮬레이션입니다.</p><button class="btn" '+(round>=22?'disabled':'')+' onclick="playRound()">경기 진행</button>'+(matchLog?'<div style="margin-top:20px" class="notice">'+matchLog+'</div>':'')+'</section><section class="card"><h2>리그 일정 진행</h2><p class="muted small">매 경기 진행 시 동일 라운드의 다른 구단 경기 결과도 계산되며, 순위표와 선수 경험치가 갱신됩니다.</p><button class="btn sub" onclick="go(\'league\')">리그 순위 확인</button></section>'}
function goals(power){let x=0,lambda=Math.max(.2,Math.min(3.1,1.25+power/29)),threshold=Math.exp(-lambda),p=1;do{x++;p*=rnd()}while(p>threshold&&x<9);return x-1}
function playRound(){if(round>=22)return;let ownMatch=null;for(let li=0;li<LEAGUES.length;li++)for(let [a,b] of fixtures[li][round]){let A=clubs[a],B=clubs[b];let av=teamPower(a),bv=teamPower(b);let tactA=a===manager?tacticModifier():0,tactB=b===manager?tacticModifier():0;let ta=goals((av-bv)*1.45+3+tactA),tb=goals((bv-av)*1.45-3+tactB);let pa=points[a],pb=points[b];pa.p++;pb.p++;pa.gf+=ta;pa.ga+=tb;pb.gf+=tb;pb.ga+=ta;if(ta>tb){pa.w++;pb.l++}else if(ta<tb){pb.w++;pa.l++}else{pa.d++;pb.d++}if(a===manager||b===manager){ownMatch=A.name+' '+ta+' : '+tb+' '+B.name;let starters=new Set(currentLineup().filter(x=>x!==null));for(let p of myPlayers()){let gain=starters.has(p.id)?rand(18,36):rand(0,4);p.xp+=gain;while(p.xp>=100){p.xp-=100;if(p.level<50){p.level++;p.pts+=3}}}}}round++;matchLog=ownMatch+' · 출전 선수 경험치 반영 완료';if(round===22){finishSeason();matchLog+=' · 시즌 종료, 승격·강등 반영'}save();render()}
function finishSeason(){let changes=[];for(let [hi,lo] of [[0,1],[2,3],[4,5],[6,7]]){let upper=standing(hi),lower=standing(lo),down=upper.slice(-2),up=lower.slice(0,2);for(let c of down)c.league=lo;for(let c of up)c.league=hi;changes.push(...up.map(c=>c.name))}season++;round=0;for(let c of clubs)points[c.id]={p:0,w:0,d:0,l:0,gf:0,ga:0};for(let i=0;i<LEAGUES.length;i++)fixtures[i]=schedule(clubs.filter(c=>c.league===i).map(c=>c.id));for(let p of players)p.age++;selectedLeague=own().league}
function viewLeague(){let c=manager?own():null;let chosen=c&&selectedLeague===0?c.league:selectedLeague;return '<section class="card"><h2>리그 순위</h2>'+leaguesChips()+'<div class="row"><h3>'+LEAGUES[selectedLeague][1]+'</h3><span class="muted small">상위 2팀 승격 / 하위 2팀 강등 (4개국만)</span></div><div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>순위</th><th>구단</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득실</th><th>승점</th></tr></thead><tbody>'+standing(selectedLeague).map((c,i)=>{let p=points[c.id];return '<tr style="'+(c.id===manager?'background:#263e2e':'')+'"><td>'+(i+1)+'</td><td>'+c.name+'</td><td>'+p.p+'</td><td>'+p.w+'</td><td>'+p.d+'</td><td>'+p.l+'</td><td>'+((p.gf-p.ga)>0?'+':'')+(p.gf-p.ga)+'</td><td><strong>'+(p.w*3+p.d)+'</strong></td></tr>'}).join('')+'</tbody></table></div></section>'}
function viewMarket(){if(!manager)return viewStart();let c=own(),candidates=players.filter(p=>p.club!==manager).sort((a,b)=>overall(b)-overall(a)).slice(0,60),opts=candidates.slice(0,20);return '<section class="card"><h2>이적시장</h2><p class="muted small">타 구단 선수를 영입할 수 있습니다. 능력치 기반 이적료가 차감되고 선수 소속이 변경됩니다. 첫 버전은 간단 영입 기능입니다.</p><div class="tablewrap"><table><thead><tr><th>선수</th><th>소속</th><th>포지션</th><th>능력</th><th>이적료</th><th></th></tr></thead><tbody>'+opts.map(p=>{let fee=Math.max(1,Math.round((overall(p)-50)*1.2))*1000000;return '<tr><td><div style="display:flex;align-items:center;gap:9px">'+avatar(p,32)+'<span>'+txt(p.name)+'</span></div></td><td>'+clubs[p.club].name+'</td><td>'+p.pos+'</td><td>'+overall(p)+'</td><td>'+Math.round(fee/1000000)+'M</td><td><button class="btn mini" '+(c.cash<fee?'disabled':'')+' onclick="buy('+p.id+','+fee+')">영입</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function buy(id,fee){let p=players.find(p=>p.id===id);if(!p||own().cash<fee)return;if(myPlayers().length>=30){alert('선수단 최대 인원은 30명입니다.');return}let seller=clubs[p.club];own().cash-=fee;seller.cash+=fee;p.club=manager;save();render()}

const ROLE_FAMILY={GK:'GK',ST:'FW',LW:'FW',RW:'FW',CAM:'MF',CM:'MF',CDM:'MF',LM:'MF',RM:'MF',CB:'DF',RB:'DF',LB:'DF'};
let lineups=(saved&&saved.lineups)||{};
function detailed(p){if(p.detail)return p.detail;const s=p.stats;const noise=(n)=>(((p.id*41+n*97)>>>0)%13)-6;const clamp=x=>Math.max(25,Math.min(95,Math.round(x)));p.detail={
 acceleration:clamp(s.pace+noise(1)),sprint:clamp(s.pace+noise(2)),finishing:clamp(s.shoot+noise(3)),shotPower:clamp(s.shoot+noise(4)),positioning:clamp(s.shoot+noise(5)),shortPass:clamp(s.pass+noise(6)),longPass:clamp(s.pass+noise(7)),vision:clamp(s.pass+noise(8)),dribble:clamp((s.pace+s.pass)/2+noise(9)),firstTouch:clamp(s.pass+noise(10)),tackle:clamp(s.defend+noise(11)),interception:clamp(s.defend+noise(12)),marking:clamp(s.defend+noise(13)),stamina:clamp(s.physical+noise(14)),strength:clamp(s.physical+noise(15)),reflex:clamp(s.defend+noise(16)),handling:clamp(s.defend+noise(17)),gkPosition:clamp(s.defend+noise(18))};return p.detail}
function overall(p){let d=detailed(p);let keys=OVR_KEYS[p.pos]||OVR_KEYS.CM;return Math.round(keys.reduce((sum,k)=>sum+d[k],0)/keys.length)}
function positionFit(p,role){if(p.pos===role)return 1;if(ROLE_FAMILY[p.pos]===ROLE_FAMILY[role])return .88;if((ROLE_FAMILY[p.pos]==='FW'&&ROLE_FAMILY[role]==='MF')||(ROLE_FAMILY[p.pos]==='MF'&&ROLE_FAMILY[role]==='FW'))return .7;return .48}
function initLineup(form){let used=new Set(),arr=[];for(let slot of FORMATIONS[form]){let choices=myPlayers().filter(p=>!used.has(p.id));choices.sort((a,b)=>overall(b)*positionFit(b,slot.r)-overall(a)*positionFit(a,slot.r));let best=choices[0];arr.push(best?best.id:null);if(best)used.add(best.id)}return arr}
function currentLineup(){if(!manager)return[];let key=manager+':'+formation;if(!lineups[key]||lineups[key].length!==11)lineups[key]=initLineup(formation);let used=new Set();lineups[key]=lineups[key].map(id=>{if(id===null||used.has(id)||!players.some(p=>p.id===id&&p.club===manager))return null;used.add(id);return id});return lineups[key]}
function effectiveLineupPower(clubId){if(clubId===manager){const selected=currentLineup(),slots=FORMATIONS[formation];let total=0,filled=0;for(let i=0;i<11;i++){const p=players.find(x=>x.id===selected[i]);if(p){total+=overall(p)*positionFit(p,slots[i].r);filled++}}return filled?total/11:30}return players.filter(p=>p.club===clubId).sort((a,b)=>overall(b)-overall(a)).slice(0,11).reduce((sum,p)=>sum+overall(p),0)/11}
function teamPower(clubId){return clubs[clubId].rating*.27+effectiveLineupPower(clubId)*.73}
function tacticModifier(){return (tactic==='attack'?2:tactic==='defend'?-1:0)+(pressure-50)/22}
function save(){try{localStorage.setItem(saveKey,JSON.stringify({version:2,manager,round,season,formation,tactic,pressure,players,points,clubs,fixtures,lineups}))}catch(e){console.warn('저장 공간이 부족하거나 저장할 수 없습니다.',e)}}
function chooseClub(id){manager=id;selectedLeague=clubs[id].league;page='dashboard';currentLineup();save();render()}
function setFormation(x){if(!FORMATIONS[x])return;formation=x;currentLineup();save();render()}
function setSlot(i,v){if(!manager)return;const slot=FORMATIONS[formation][i],id=Number(v),p=players.find(p=>p.id===id&&p.club===manager);if(!p)return;let arr=currentLineup(),old=arr.indexOf(id);if(old!==-1)arr[old]=arr[i];arr[i]=id;save();render()}
function resetLineup(){lineups[manager+':'+formation]=initLineup(formation);save();render()}
function viewTactics(){let lineup=currentLineup(),slots=FORMATIONS[formation];let fitScore=0;const spots=slots.map((slot,i)=>{let p=players.find(x=>x.id===lineup[i]);let score=p?Math.round(overall(p)*positionFit(p,slot.r)):0;fitScore+=score;return '<div class="lineup-spot" style="left:'+slot.x+'%;top:'+slot.y+'%"><span class="playerdot">'+slot.r+'</span><div class="lineup-name">'+(p?txt(p.name.split(' ').slice(-1)[0]):'미배정')+'</div></div>'}).join('');return '<div class="grid two"><section class="card"><div class="row"><h2>포메이션</h2><button class="btn sub mini" onclick="resetLineup()">자동 선발</button></div><div class="chips">'+Object.keys(FORMATIONS).map(x=>'<button class="chip '+(formation===x?'on':'')+'" onclick="setFormation(\''+x+'\')">'+({433:'4-3-3',4231:'4-2-3-1',442:'4-4-2',352:'3-5-2',343:'3-4-3'}[x])+'</button>').join('')+'</div><div class="pitch"><div class="half"></div>'+spots+'</div><div class="lineup-stats"><span>선발 11명</span><span>예상 전력 '+Math.round(fitScore/11)+'</span><span>포지션 적합도 반영</span></div></section><section class="card"><h2>선발 11명 설정</h2><p class="muted small">포지션별 선수를 선택하세요. 동일 선수 중복 선택 시 두 위치를 교체합니다.</p>'+slots.map((slot,i)=>'<div class="slotpick"><span class="tag">'+slot.r+'</span><select aria-label="'+slot.r+' 선발 선수" onchange="setSlot('+i+',this.value)">'+myPlayers().slice().sort((a,b)=>overall(b)*positionFit(b,slot.r)-overall(a)*positionFit(a,slot.r)).map(p=>'<option value="'+p.id+'" '+(p.id===lineup[i]?'selected':'')+'>'+txt(p.name)+' · '+p.pos+' '+overall(p)+(p.pos!==slot.r?' ('+Math.round(positionFit(p,slot.r)*100)+'%)':'')+'</option>').join('')+'</select></div>').join('')+'<h2 style="margin-top:20px">팀 전술</h2><div class="setting"><label>경기 운영</label><select onchange="setTactic(this.value)"><option value="balanced" '+(tactic==='balanced'?'selected':'')+'>균형</option><option value="attack" '+(tactic==='attack'?'selected':'')+'>공격적</option><option value="defend" '+(tactic==='defend'?'selected':'')+'>수비적</option></select></div><div class="setting"><label>압박 강도 <span id="pressnum">'+pressure+'</span></label><input type="range" min="10" max="90" step="5" value="'+pressure+'" oninput="setPressure(this.value)"/></div><p class="muted small">선발 선수 능력치와 포지션 적합도는 다음 경기 결과 계산에 반영됩니다.</p><button class="btn" onclick="go(\'match\')">경기 준비 완료</button></section></div>'}

function upgrade(key){let p=players.find(x=>x.id===selectedPlayer);if(!p||p.pts<=0||!Object.values(ATTRIBUTE_GROUPS).flat().some(v=>v[0]===key))return;let d=detailed(p);if(d[key]>=99)return;p.pts--;d[key]++;save();render()}
function viewMatch(){let starters=manager?currentLineup().filter(x=>x!==null).length:0;return '<section class="card"><div class="eyebrow">MATCH CENTRE · ROUND '+(round+1)+'</div><h2 style="margin:12px 0">'+nextOpponent()+'</h2><div class="lineup-stats"><span>포메이션 '+({433:'4-3-3',4231:'4-2-3-1',442:'4-4-2',352:'3-5-2',343:'3-4-3'}[formation])+'</span><span>선발 '+starters+'명</span><span>팀 경기력 '+Math.round(teamPower(manager))+'</span></div><p class="muted small">선발 선수의 세부 능력치, 포지션 적합도, 전술 운영과 홈 이점을 반영합니다. 현재 경기 표현은 텍스트 기반입니다.</p><button class="btn" '+(round>=22||starters!==11?'disabled':'')+' onclick="playRound()">경기 진행</button>'+(matchLog?'<div style="margin-top:20px" class="notice">'+matchLog+'</div>':'')+'</section><section class="card"><h2>전술 변경</h2><p class="muted small">경기 전에 선발과 포메이션을 변경할 수 있습니다. 출전 선수에게 더 많은 경험치가 지급됩니다.</p><button class="btn sub" onclick="go(\'tactics\')">선발 · 전술 설정</button></section>'}

function playerBio(p){
 if(!p.nationality){const c=clubs.find(x=>x.id===p.club),other=LEAGUES[(p.id*13+7)%LEAGUES.length][0];p.nationality=p.id%4===0?other:c.country}
 if(!p.height)p.height=(p.pos==='GK'?185:168)+(p.id*7%16);
 if(!p.weight)p.weight=62+(p.id*11%28);
 if(!p.foot)p.foot=p.id%5===0?'왼발':'오른발';
 if(!p.contractUntil)p.contractUntil=season+1+p.id%4;
 return p;
}

function onboardingError(message){const el=document.getElementById('career-notice');if(el){el.style.display='block';el.textContent=message}else alert(message)}
function createCareerClub(){
 const name=(document.getElementById('club-name')?.value||'').trim();
 const coach=(document.getElementById('coach-name')?.value||'').trim();
 const color=document.getElementById('club-color')?.value||'#345d8a';
 if(name.length<3){onboardingError('구단 이름은 3자 이상 입력해주세요.');return}
 if(name.length>38){onboardingError('구단 이름은 38자 이하로 입력해주세요.');return}
 if(clubs.some(c=>c.name.toLocaleLowerCase()===name.toLocaleLowerCase())){onboardingError('이미 존재하는 구단 이름입니다.');return}
 if(!/^#[0-9a-fA-F]{6}$/.test(color)){onboardingError('올바른 대표색을 지정해주세요.');return}
 const target=clubs.filter(c=>c.league===selectedLeague).sort((a,b)=>a.rating-b.rating)[0];
 if(!target){onboardingError('참가 가능한 리그가 없습니다.');return}
 target.name=name;target.color=color;target.rating=64;target.cash=25000000;
 coachName=coach||'신임 감독';createdClub=true;manager=target.id;
 for(const p of players.filter(p=>p.club===manager)){p.level=1;p.xp=0}
 currentLineup();page='dashboard';save();render()
}

 currentLineup();page='dashboard';save();render()
}

 const h=(Math.imul(p.id+1,2654435761)>>>0);
 const tile=h%(FACE_SHEETS.length*12);
 const sheet=Math.floor(tile/12);
 const position=tile%12;

/* First-run experience v3: nickname -> league -> existing club + seeded player squad */
let setupNickname=coachName||'',setupClubId=null;
function safeName(s){return txt(s).replaceAll('"','&quot;').replaceAll("'","&#39;")}
function updateNickname(s){setupNickname=s}
function setupChooseLeague(i){selectedLeague=i;setupClubId=null;render()}
function setupChooseClub(i){setupClubId=i;render()}
function startWithClub(){
 const nick=(document.getElementById('setup-nickname')?.value||setupNickname||'').trim();
 if(nick.length<2||nick.length>24){const box=document.getElementById('setup-message');if(box)box.textContent='닉네임은 2~24자로 입력해 주세요.';return}
 const club=clubs.find(c=>c.id===setupClubId&&c.league===selectedLeague);
 if(!club){const box=document.getElementById('setup-message');if(box)box.textContent='먼저 참가할 구단을 선택해 주세요.';return}
 coachName=nick;setupNickname=nick;createdClub=false;manager=club.id;
 selectedLeague=club.league;currentLineup();page='dashboard';save();render()
}
function viewStart(){
 if(setupClubId===null||!clubs.some(c=>c.id===setupClubId&&c.league===selectedLeague)){setupClubId=clubs.filter(c=>c.league===selectedLeague)[0]?.id??null}
 const selected=clubs.find(c=>c.id===setupClubId);
 const squad=selected?players.filter(p=>p.club===selected.id).sort((a,b)=>overall(b)-overall(a)):[];
 const steps='<div class="career-steps"><span class="current">닉네임 설정</span><span class="current">리그 선택</span><span class="current">구단 선택</span><span>선수단 확인</span></div>';
 return '<div class="start-layout"><div><section class="card">'+steps+
 '<h2>감독 커리어 시작</h2><p class="muted">닉네임을 정하고 원하는 구단을 선택하세요. 각 구단에는 기본 선수 23명이 이미 배정되어 있습니다.</p>'+
 '<label for="setup-nickname" style="display:block;margin:18px 0 8px;font-weight:600">감독 닉네임</label><input id="setup-nickname" class="nickname-input" maxlength="24" placeholder="사용할 닉네임 입력" value="'+safeName(setupNickname)+'" oninput="updateNickname(this.value)"></section>'+
 '<section class="card"><h2>국가 · 리그 선택</h2><div class="league-choice">'+LEAGUES.map((l,i)=>'<button class="'+(selectedLeague===i?'chosen':'')+'" onclick="setupChooseLeague('+i+')">'+COUNTRY_FLAGS[l[0]]+' '+l[0]+' '+l[2]+'부</button>').join('')+'</div>'+
 '<div class="start-toolbar"><div><h2 style="margin:0 0 4px">'+txt(LEAGUES[selectedLeague][1])+'</h2><div class="muted small">12개 구단 · 22라운드 · 기존 구단 선택</div></div><span class="tag">CLUB SELECTION</span></div>'+
 '<div class="team-grid">'+clubs.filter(c=>c.league===selectedLeague).map(c=>'<button class="team-tile '+(c.id===setupClubId?'chosen':'')+'" onclick="setupChooseClub('+c.id+')">'+shield(c)+'<span style="min-width:0"><strong>'+txt(c.name)+'</strong><small>구단 전력 '+c.rating+' · 선수 23명</small></span></button>').join('')+'</div></section></div>'+
 '<aside class="card team-preview"><div class="eyebrow">SELECTED CLUB</div>'+(selected?'<div class="club-mark">'+shield(selected)+'<div><h2 style="margin:0 0 4px">'+txt(selected.name)+'</h2><span class="muted small">'+txt(LEAGUES[selected.league][1])+'</span></div></div><div class="lineup-stats"><span>구단 전력 '+selected.rating+'</span><span>선수 23명</span><span>예산 '+Math.round(selected.cash/1000000)+'M</span></div><h3>기본 선수단 미리보기</h3><p class="muted small">구단마다 선수 이름·포지션·능력치가 미리 생성되어 있습니다.</p><div class="preview-squad">'+squad.slice(0,15).map(p=>'<div><div>'+avatar(p,58)+'</div><div class="preview-squad-label">'+txt(p.name.split(' ').at(-1))+'</div></div>').join('')+'</div><div class="tablewrap"><table><thead><tr><th>선수</th><th>포지션</th><th>OVR</th></tr></thead><tbody>'+squad.slice(0,5).map(p=>'<tr><td>'+txt(p.name)+'</td><td>'+p.pos+'</td><td>'+overall(p)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">구단을 선택해 주세요.</p>')+
 '<p id="setup-message" style="color:#b44343;font-size:12px"></p><button class="btn" style="width:100%;padding:14px" onclick="startWithClub()">이 구단으로 커리어 시작</button>'+
 (manager!==null?'<button class="btn sub" style="width:100%;margin-top:9px" onclick="go(\'dashboard\')">현재 커리어 계속하기</button>':'')+'</aside></div>'

 '<section class="card"><div class="row"><div><h2>다음 경기</h2><p class="muted small">'+(round+1)+'라운드 / 22라운드</p></div><button class="btn" onclick="go(\'match\')">경기 준비</button></div><p style="font-size:18px;text-align:center;margin:25px 0">'+nextOpponent()+'</p></section>'

/* Face atlas crop: element is exactly 4 columns × 3 rows, preserving 1:1 ratio. */
function avatar(p,size=42){
 const h=Math.imul(p.id+1,2654435761)>>>0,tile=h%(FACE_SHEETS.length*12),sheet=Math.floor(tile/12),slot=tile%12,col=slot%4,row=Math.floor(slot/4);
 return '<span class="face-tile" style="width:'+size+'px;height:'+size+'px" title="가상 선수 얼굴">'
  +'<span class="face-fallback">'+svgAvatarFallback(p,size)+'</span>'
  +'<img loading="lazy" decoding="async" alt="" src="'+FACE_SHEETS[sheet]+'" style="position:absolute;width:400%;height:300%;max-width:none;left:-'+(col*100)+'%;top:-'+(row*100)+'%;object-fit:fill" onerror="this.style.display=\'none\'">'
  +'</span>'
}
