function goals(power){let x=0,lambda=Math.max(.2,Math.min(3.1,1.25+power/29)),threshold=Math.exp(-lambda),p=1;do{x++;p*=rnd()}while(p>threshold&&x<9);return x-1}
function playRound(){if(round>=22)return;let ownMatch=null;for(let li=0;li<LEAGUES.length;li++)for(let [a,b] of fixtures[li][round]){let A=clubs[a],B=clubs[b];let av=teamPower(a),bv=teamPower(b);let tactA=a===manager?tacticModifier():0,tactB=b===manager?tacticModifier():0;let ta=goals((av-bv)*1.45+3+tactA),tb=goals((bv-av)*1.45-3+tactB);let pa=points[a],pb=points[b];pa.p++;pb.p++;pa.gf+=ta;pa.ga+=tb;pb.gf+=tb;pb.ga+=ta;if(ta>tb){pa.w++;pb.l++}else if(ta<tb){pb.w++;pa.l++}else{pa.d++;pb.d++}if(a===manager||b===manager){ownMatch=A.name+' '+ta+' : '+tb+' '+B.name;let starters=new Set(currentLineup().filter(x=>x!==null));for(let p of myPlayers()){let gain=starters.has(p.id)?rand(18,36):rand(0,4);p.xp+=gain;while(p.xp>=100){p.xp-=100;if(p.level<50){p.level++;p.pts+=3}}}}}round++;matchLog=ownMatch+' · 출전 선수 경험치 반영 완료';if(round===22){finishSeason();matchLog+=' · 시즌 종료, 승격·강등 반영'}save();render()}
function finishSeason(){
 const previousSeason=season,oldLeague=own().league;
 const finalRank=standing(oldLeague).findIndex(c=>c.id===manager)+1;
 const top=standing(oldLeague)[0],isWinner=top?.id===manager;
 const inSecond=LEAGUES[oldLeague][2]===2;
 const isPromoted=inSecond&&finalRank<=2,isRelegated=!inSecond&&[0,2,4,6].includes(oldLeague)&&finalRank>=11;
 let reward=isWinner?650:finalRank<=3?250:0;
 if(isPromoted)reward+=300;
 walletGBP+=reward;
 const summary=(isWinner?'리그 우승 · ':'')+(isPromoted?'상위 리그 승격 · ':'')+(isRelegated?'하위 리그 강등 · ':'')+finalRank+'위';
 seasonAwards.push({season:previousSeason,league:oldLeague,rank:finalRank,summary,reward});
 careerArchive.seasons[previousSeason]={season:previousSeason,club:manager,league:oldLeague,rank:finalRank,standings:LEAGUES.map((l,i)=>standing(i).map(c=>({id:c.id,name:c.name,...points[c.id]}))),cups:cupState?JSON.parse(JSON.stringify(cupState)):null};persistCareerArchive();
 previousTopFour={season:previousSeason,entries:LEAGUES.flatMap((l,i)=>standing(i).slice(0,4).map((c,j)=>({id:c.id,nation:l[0],division:l[2],rank:j+1})))};
 const transitions=[];
 for(const [hi,lo] of [[0,1],[2,3],[4,5],[6,7]]){
  const upper=standing(hi),lower=standing(lo),down=upper.slice(-2),up=lower.slice(0,2);
  for(const c of down){c.league=lo;transitions.push({club:c.id,from:hi,to:lo})}
  for(const c of up){c.league=hi;transitions.push({club:c.id,from:lo,to:hi})}
 }
 season++;round=0;cupState=null;activeCompetition='league';
 for(const [id] of Object.entries(points))points[id]={p:0,w:0,d:0,l:0,gf:0,ga:0};
 for(let li=0;li<LEAGUES.length;li++)fixtures[li]=schedule(clubs.filter(c=>c.league===li).map(c=>c.id));
 for(const p of players)p.age++;
 for(const t of pendingTransfers){
  if(t.joinSeason!==season)continue;
  const p=players.find(x=>x.id===t.id);if(p&&myPlayers().length<squadCapacity()){p.club=manager;p.jerseyNumber=null;p.jerseyAutoVersion=0}
 }
 pendingTransfers=pendingTransfers.filter(t=>t.joinSeason>season);
 ensureJerseyNumbers();
 selectedLeague=own().league;
}

function detailed(p){if(p.detail)return p.detail;const s=p.stats;const noise=(n)=>(((p.id*41+n*97)>>>0)%13)-6;const clamp=x=>Math.max(25,Math.min(95,Math.round(x)));p.detail={
 acceleration:clamp(s.pace+noise(1)),sprint:clamp(s.pace+noise(2)),finishing:clamp(s.shoot+noise(3)),shotPower:clamp(s.shoot+noise(4)),positioning:clamp(s.shoot+noise(5)),shortPass:clamp(s.pass+noise(6)),longPass:clamp(s.pass+noise(7)),vision:clamp(s.pass+noise(8)),dribble:clamp((s.pace+s.pass)/2+noise(9)),firstTouch:clamp(s.pass+noise(10)),tackle:clamp(s.defend+noise(11)),interception:clamp(s.defend+noise(12)),marking:clamp(s.defend+noise(13)),stamina:clamp(s.physical+noise(14)),strength:clamp(s.physical+noise(15)),reflex:clamp(s.defend+noise(16)),handling:clamp(s.defend+noise(17)),gkPosition:clamp(s.defend+noise(18))};return p.detail}
function overall(p){return Math.round(preciseOverall(p))}
function positionFit(p,role){if(p.pos===role)return 1;if(ROLE_FAMILY[p.pos]===ROLE_FAMILY[role])return .88;if((ROLE_FAMILY[p.pos]==='FW'&&ROLE_FAMILY[role]==='MF')||(ROLE_FAMILY[p.pos]==='MF'&&ROLE_FAMILY[role]==='FW'))return .7;return .48}
function initLineup(form){let used=new Set(),arr=[];for(let slot of FORMATIONS[form]){let choices=myPlayers().filter(p=>!used.has(p.id));choices.sort((a,b)=>overall(b)*positionFit(b,slot.r)-overall(a)*positionFit(a,slot.r));let best=choices[0];arr.push(best?best.id:null);if(best)used.add(best.id)}return arr}
function currentLineup(){if(manager===null)return[];let key=manager+':'+formation;if(!lineups[key]||lineups[key].length!==11)lineups[key]=initLineup(formation);let used=new Set();lineups[key]=lineups[key].map(id=>{if(id===null||used.has(id)||!players.some(p=>p.id===id&&p.club===manager))return null;used.add(id);return id});return lineups[key]}
function effectiveLineupPower(clubId){if(clubId===manager){const selected=currentLineup(),slots=FORMATIONS[formation];let total=0,filled=0;for(let i=0;i<11;i++){const p=players.find(x=>x.id===selected[i]);if(p){total+=overall(p)*positionFit(p,slots[i].r);filled++}}return filled?total/11:30}return players.filter(p=>p.club===clubId).sort((a,b)=>overall(b)-overall(a)).slice(0,11).reduce((sum,p)=>sum+overall(p),0)/11}

function playRound(){
 if(round>=22||manager===null||!simFinalOverride||simFinalOverride.competition!=='league')return;
 if(pendingReward?.club===manager){matchTab='rewards';page='match';render();return}
 const y=season,week=round,club=own(),myPair=matchPair(),starting=currentLineup().slice(),lineup=starting.map(id=>players.find(p=>p.id===id)),entry=[];
 let ownScore=null;
 for(let li=0;li<LEAGUES.length;li++){
  const recorded=[];
  for(let [a,b] of fixtures[li][week]){
   const A=clubs[a],B=clubs[b],av=teamPower(a),bv=teamPower(b);
   const ta=a===manager?tacticModifier():0,tb=b===manager?tacticModifier():0;
   let gA=goals((av-bv)*1.45+3+ta),gB=goals((bv-av)*1.45-3+tb);
   if(simFinalOverride&&(a===manager||b===manager)&&li===own().league){gA=simFinalOverride.homeGoals;gB=simFinalOverride.awayGoals}
   recorded.push([gA,gB]);
   const pa=points[a],pb=points[b];pa.p++;pb.p++;pa.gf+=gA;pa.ga+=gB;pb.gf+=gB;pb.ga+=gA;
   if(gA>gB){pa.w++;pb.l++}else if(gA<gB){pb.w++;pa.l++}else{pa.d++;pb.d++}
   if(a===manager||b===manager)ownScore={home:a,away:b,homeGoals:gA,awayGoals:gB};
  }
  matchResults[fixtureKey(y,li,week)]=recorded;
  careerArchive.leagueScores[fixtureKey(y,li,week)]=(fixtures[li][week]||[]).map((pair,i)=>({home:pair[0],away:pair[1],score:recorded[i]}));
 }
 const lineupOut=[],starterSet=new Set(simFinalOverride?.participants||starting),isWin=ownScore&&(manager===ownScore.home?ownScore.homeGoals>ownScore.awayGoals:ownScore.awayGoals>ownScore.homeGoals),isDraw=ownScore&&ownScore.homeGoals===ownScore.awayGoals;
 let totalXP=0;
 for(const p of myPlayers()){
  const isStarter=starterSet.has(p.id);
  const xp=isStarter?rand(18,36):rand(8,14);
  p.xp+=xp;if(isStarter){totalXP+=xp;lineupOut.push({id:p.id,rating:matchPerformanceRating(p,simFinalOverride?.events||[],isWin?'승리':isDraw?'무승부':'패배'),xp})}
  while(p.xp>=100){p.xp-=100;if(p.level<50){p.level++;p.pts+=3}}
 }
 const money=(isWin?80:isDraw?45:25),pts=isWin?3:isDraw?1:0;
 walletGBP+=money;
 lastMatch={club:manager,season:y,round:week,home:ownScore.home,away:ownScore.away,homeGoals:ownScore.homeGoals,awayGoals:ownScore.awayGoals,formation,lineup:lineupOut,money,totalXP,outcome:isWin?'승리':isDraw?'무승부':'패배',leaguePts:pts,events:simFinalOverride?.events||[],substitutions:simFinalOverride?.substitutions||[],instruction:simFinalOverride?.instruction||tactic};
 creditCoachMatch(lastMatch);archiveCalendarMatch(lastMatch);
 recoverFitnessAfterMatch([...starterSet]);
 advanceInjuryRecovery(round);
 fixInjuredLineup();
 round++;updateEliminatedCups();scheduleRound=Math.min(round,21);matchTab='result';pendingReward={club:manager,season:y,round:week};simFinalOverride=null;simState=null;
 if(round>=22){finishSeason();scheduleRound=0}
 save();render()
}

function clubBrand(c){

 let symbol=CLUB_RESERVED[c.nameEn||c.name]||CLUB_SYMBOLS[(id*11+Math.floor(id/3))%CLUB_SYMBOLS.length];
 if(!CLUB_RESERVED[c.nameEn||c.name]){
  if(/king|royal|crown|real|regal/.test(title))symbol='crown';
  else if(/port|harbour|haven|marina|coast|lake|rio|river|sea/.test(title))symbol='wave';
  else if(/bridge|bruck|brug/.test(title))symbol='bridge';
  else if(/oak|wald|wood|forest|grun/.test(title))symbol='oak';
  else if(/mont|berg|mount|fell|hill/.test(title))symbol='mountain';

 }
 // Always derive crest lettering from the immutable English seed, never the localized display name.
 const seedName=LEAGUES[Math.floor(id/12)]?.[3]?.[id%12]||c.nameEn||c.name;
 const asciiWords=String(seedName).match(/[A-Za-z]+/g)||[];
 const initials=(asciiWords.length>1?asciiWords[0][0]+asciiWords[1][0]:(asciiWords[0]||'FC').slice(0,2)).toUpperCase().replace(/[^A-Z]/g,'').slice(0,2)||'FC';
 return {primary:colors[0],secondary:colors[1],shape:CLUB_SHAPES[(id+countryIndex*2)%5],symbol,initials};
}

function registerStoredCard(id){
 if(simState||myPlayers().length>=squadCapacity()){showGameDialog('선수단 등록 불가',[['조건',simState?'경기 종료 후 등록 가능':'선수단 정원 초과']]);return}
 const i=coachCards.findIndex(p=>p.id===id);if(i<0)return;if(coachCards[i].locked){showGameDialog('잠금된 카드',[['안내','잠금 해제 후 등록 가능']]);return}if(myPlayers().length+pendingTransfers.length>=squadCapacity()){showGameDialog('선수단 정원 초과',[['안내','예약 영입 포함 정원 초과']]);return}const p=coachCards.splice(i,1)[0];
 if(players.some(x=>x.id===p.id))p.id=Math.max(0,...players.map(x=>x.id),...coachCards.map(x=>x.id),...youthVault.map(x=>x.id))+1;
 p.club=manager;p.jerseyNumber=null;p.growthBase=p.growthBase||{...detailed(p)};players.push(p);ensureJerseyNumbers();save();render();showGameDialog('선수단 등록 완료',[['선수',p.name]]);
}
function logEconomy(type,amount,detail){economyLog.unshift({type,amount,detail,time:Date.now()});economyLog=economyLog.slice(0,200)}
function setCardSearch(v){cardSearch=v.trim().toLowerCase();render()}
function setCardPosition(v){cardPosition=v;render()}
function playerGrowthBase(p){
 if(p.growthBase)return {...p.growthBase};
 // Reconstruct original detailed attributes from base stats when old saves lack a baseline.
 const copy={...p};delete copy.detail;return {...detailed(copy)};
}
function recoverableXP(p){return Math.max(0,(Math.max(1,Number(p.level)||1)-1)*100+(Number(p.xp)||0))}
function squadPlayerActions(p){return '<div class="squad-player-actions"><button class="btn sub" onclick="confirmReturnCard('+p.id+')">카드로 전환</button><button class="btn sub" onclick="confirmReleasePlayer('+p.id+')">선수 방출</button><button class="btn sub" onclick="openPotionUse('+p.id+')">경험치 포션 사용</button><button class="btn sub" onclick="go(\'shop\');setShopTab(\'items\')">선수단 확장</button></div>'}
function canRemoveSquadPlayer(p){return !!p&&p.club===manager&&!simState&&myPlayers().length>11&&(p.pos!=='GK'||myPlayers().filter(x=>x.pos==='GK').length>1)}
function detachSquadPlayer(p){players=players.filter(x=>x.id!==p.id);for(const key of Object.keys(lineups))if(key.startsWith(manager+':'))lineups[key]=lineups[key].map(id=>id===p.id?null:id);selectedPlayer=null;fixInjuredLineup()}
function confirmReturnCard(id){
 const p=players.find(x=>x.id===id&&x.club===manager);if(!canRemoveSquadPlayer(p)){showGameDialog('카드 전환 불가',[['조건','경기 종료 후 최소 11명 및 골키퍼 1명 유지']]);return}
 const xp=recoverableXP(p),base=playerGrowthBase(p),recover=xp>0&&coachItems.extract>0;
 economyConfirm('선수 카드로 전환하시겠습니까?',[['선수',p.name],['강화 등급','+'+enhancementLevel(p)+' 유지'],['회수 경험치',recover?xp+' XP':'0 XP'],['회수권',recover?'1개 사용':'사용하지 않음']],()=>{if(!canRemoveSquadPlayer(p)||(recover&&!coachItems.extract))return;if(recover){coachItems.extract--;xpPotions.push({id:'xp-'+Date.now()+'-'+Math.random().toString(36).slice(2),xp,source:p.name})}detachSquadPlayer(p);p.detail=base;p.growthBase={...base};p.level=1;p.xp=0;p.pts=0;p.club=null;p.locked=false;p.packTier=p.packTier||Math.max(50,Math.min(90,Math.floor(overall(p)/10)*10));coachCards.push(p);save();render();showGameDialog('카드 전환 완료',[['선수',p.name],['경험치 포션',recover?xp+' XP 획득':'회수 없음']])},'카드 전환','레벨, 경험치, 육성 능력치는 초기화됩니다. 강화 등급은 유지됩니다.'+(xp&&!recover?' 회수권이 없어 경험치를 잃게 됩니다.':''));
}
function confirmReleasePlayer(id){const p=players.find(x=>x.id===id&&x.club===manager);if(!canRemoveSquadPlayer(p)){showGameDialog('방출 불가',[['조건','경기 종료 후 최소 11명 및 골키퍼 1명 유지']]);return}economyConfirm('선수를 방출하시겠습니까?',[['선수',p.name],['방출 보상','없음']],()=>{if(!canRemoveSquadPlayer(p))return;detachSquadPlayer(p);save();render();showGameDialog('방출 완료',[['선수',p.name]])},'방출','방출된 선수 및 육성 기록은 복구할 수 없습니다.')}
function xpPotionInventory(){return '<h3>경험치 포션 · '+xpPotions.length+'개</h3>'+ (xpPotions.map(p=>'<div class="result-rating-row"><span>'+txt(p.source)+' 경험치 포션</span><b>'+p.xp+' XP</b></div>').join('')||'<p class="muted small">보유 포션 없음</p>')+'<button class="btn sub" onclick="go(\'squad\')">선수단에서 사용</button>'}
function openPotionUse(id){const p=players.find(x=>x.id===id&&x.club===manager);if(!p||simState)return;if(!xpPotions.length){showGameDialog('경험치 포션 없음',[['안내','카드 전환 시 경험치 회수권으로 획득']]);return}dismissGameDialog();const el=document.createElement('div');el.id='elevos-game-dialog';el.className='game-dialog';el.innerHTML='<div class="game-dialog-content"><h2>경험치 포션 사용</h2><p>'+txt(p.name)+'</p>'+xpPotions.map((x,i)=>'<div class="result-rating-row"><span>'+txt(x.source)+' · '+x.xp+' XP</span><button class="btn" onclick="applyXpPotion('+id+','+i+')">사용</button></div>').join('')+'<button class="btn sub" onclick="dismissGameDialog()">닫기</button></div>';document.body.appendChild(el)}
function applyXpPotion(id,i){const p=players.find(x=>x.id===id&&x.club===manager),x=xpPotions[i];if(!p||!x||simState)return;const room=Math.max(0,(50-p.level)*100-p.xp),amount=Math.min(room,x.xp);if(!amount){showGameDialog('경험치 사용 불가',[['안내','최대 레벨에 도달했습니다.']]);return}economyConfirm('경험치 포션을 사용하시겠습니까?',[['선수',p.name],['적용 경험치',amount+' XP']],()=>{if(!players.includes(p)||!xpPotions.includes(x)||simState)return;p.xp+=amount;while(p.xp>=100&&p.level<50){p.xp-=100;p.level++;p.pts+=3}x.xp-=amount;if(x.xp<=0)xpPotions=xpPotions.filter(v=>v!==x);save();render();showGameDialog('경험치 적용 완료',[['선수',p.name],['레벨',String(p.level)]])},'사용')}
function testGrantPanel(){return !cloudLocalUid&&!testGrantDone?'<section class="card"><h2>로컬 테스트 지급</h2><p class="muted small">게스트 커리어 전용 · 1회 지급</p><button class="btn" onclick="grantTestInventory()">테스트 아이템 받기</button></section>':''}
function grantTestInventory(){if(cloudLocalUid||testGrantDone||manager===null||simState)return;economyConfirm('테스트 물품을 지급할까요?',[['파운드','£10,000'],['선수 카드','등급별 100장'],['선수팩','등급별 100개'],['아이템','종류별 100개']],()=>{if(cloudLocalUid||testGrantDone||simState)return;const batch=[];let pid=Math.max(0,...players.map(p=>p.id),...coachCards.map(p=>p.id),...youthVault.map(p=>p.id))+1;for(const tier of [50,60,70,80,90])for(let j=0;j<100;j++){const target=rand(tier,tier+9),pos=['GK','CB','CM','ST','LW','RB'][j%6],p={id:pid++,club:null,name:first[rand(0,first.length-1)]+' '+last[rand(0,last.length-1)],pos,age:rand(18,29),level:1,xp:0,pts:0,potential:Math.min(120,target+10),stats:{pace:target,shoot:target,pass:target,defend:target,physical:target},enhancementLevel:1,packTier:tier};playerBio(p);p.nameEn=p.name;applyCuratedAsianName(p);p.name=localizedPlayerName(p);for(const k of OVR_KEYS[pos]||OVR_KEYS.CM)detailed(p)[k]=target;batch.push(p)}coachCards.push(...batch);for(const tier of [50,60,70,80,90])for(let j=0;j<100;j++)coachPacks.push({id:'test-'+tier+'-'+j,tier,level:0});for(const k of Object.keys(ITEM_INFO))coachItems[k]=(coachItems[k]||0)+100;walletGBP+=10000;testGrantDone=true;save();render();showGameDialog('테스트 지급 완료',[['파운드','£10,000'],['카드','500장'],['선수팩','500개'],['아이템','종류별 100개']])},'지급')}
Object.assign(window,{confirmReturnCard,confirmReleasePlayer,openPotionUse,applyXpPotion,grantTestInventory});
function storedCardPrice(p,level=enhancementLevel(p)){const base=Math.floor((PACK_INFO[p.packTier]?.price||100)*.30);let added=0;for(let i=2;i<=level;i++)added+=Math.round(ENHANCE_COST[i]*.7);return base+added+Math.round(base*.12*(level-1))}
function economyConfirm(title,rows,action,label='확인',note=''){
 dismissGameDialog();const el=document.createElement('div');el.id='elevos-game-dialog';el.className='game-dialog';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label',title);
 el.innerHTML='<div class="game-dialog-content economy-confirm"><div class="economy-dialog-title">'+txt(title)+'</div><div class="economy-dialog-body">'+rows.map(([k,v])=>'<div class="cost-row"><span>'+txt(k)+'</span><strong>'+txt(v)+'</strong></div>').join('')+(note?'<p>'+txt(note)+'</p>':'')+'</div><div class="economy-dialog-actions"><button class="btn sub" data-cancel>취소</button><button class="btn" data-confirm>'+txt(label)+'</button></div></div>';
 el.querySelector('[data-cancel]').onclick=()=>el.remove();el.querySelector('[data-confirm]').onclick=()=>{el.remove();action()};document.body.appendChild(el);el.querySelector('[data-cancel]').focus();
}
function storedCardActions(p){
 const n=enhancementLevel(p),next=n+1;
 return '<div class="stored-actions"><button class="btn sub mini" onclick="toggleStoredLock('+p.id+')">'+(p.locked?'잠금 해제':'카드 잠금')+'</button><button class="btn sub mini" '+(p.locked?'disabled':'')+' onclick="confirmStoredSale('+p.id+')">판매 '+formatGBP(storedCardPrice(p))+'</button></div>'+(n<10?'<div class="stored-enhance"><strong>+'+n+' → +'+next+'</strong><small>성공률 '+Math.round(ENHANCE_CHANCE[next]*100)+'% · '+formatGBP(ENHANCE_COST[next])+'</small><label><input type="checkbox" id="use-card-protect" '+(coachItems.protect?'':'disabled')+'> 강화 보호권 ('+coachItems.protect+')</label><button class="btn sub" '+(p.locked?'disabled':'')+' onclick="enhanceStoredCard('+p.id+')">강화하기</button></div>':'<p>최대 강화 완료</p>');

function toggleStoredLock(id){const p=coachCards.find(x=>x.id===id);if(!p)return;p.locked=!p.locked;recycleIds=recycleIds.filter(x=>x!==id);save();render()}
function confirmStoredSale(id){const p=coachCards.find(x=>x.id===id&&!x.locked);if(!p)return;economyConfirm('선수 카드를 판매하시겠습니까?',[['선수',p.name],['강화 등급','+'+enhancementLevel(p)],['판매 금액',formatGBP(storedCardPrice(p))]],()=>sellStoredCard(id),'판매','판매한 카드는 복구할 수 없습니다.')}
function sellStoredCard(id){const i=coachCards.findIndex(x=>x.id===id&&!x.locked);if(i<0)return;const p=coachCards[i],money=storedCardPrice(p);coachCards.splice(i,1);recycleIds=recycleIds.filter(x=>x!==id);walletGBP+=money;logEconomy('판매',money,p.name);save();render();showGameDialog('판매 완료',[['획득 금액',formatGBP(money)]])}
function enhanceStoredCard(id){
 const p=coachCards.find(x=>x.id===id&&!x.locked);if(!p||enhancementLevel(p)>=10)return;
 const n=enhancementLevel(p),target=n+1,cost=ENHANCE_COST[target],use=!!document.getElementById('use-card-protect')?.checked&&coachItems.protect>0;
 if(walletGBP<cost){showGameDialog('보유 금액 부족',[['필요 금액',formatGBP(cost)]]);return}
 economyConfirm('선수 카드를 강화하시겠습니까?',[['강화','+'+n+' → +'+target],['비용',formatGBP(cost)],['성공률',Math.round(ENHANCE_CHANCE[target]*100)+'%'],['성공 시 판매가',formatGBP(storedCardPrice(p,target))]],()=>{if(!coachCards.includes(p)||p.locked||enhancementLevel(p)!==n||walletGBP<cost||(use&&!coachItems.protect))return;
 walletGBP-=cost;if(use)coachItems.protect--;
 const success=Math.random()<ENHANCE_CHANCE[target];p.enhancementLevel=success?target:!use&&n>=5?n-1:n;
 logEconomy('강화',-cost,p.name);save();render();showGameDialog(success?'강화 성공!':'강화 실패',[['선수',p.name],['강화 등급','+'+n+' → +'+enhancementLevel(p)],['종합 능력치',String(overall(p))],['현재 판매가',formatGBP(storedCardPrice(p))]]);},'강화',use?'보호권 1개 사용':'실패 시 기존 강화 규칙 적용');
}
function setRecycleCard(id,on){const p=coachCards.find(x=>x.id===id&&!x.locked);if(!p)return;recycleIds=recycleIds.filter(x=>x!==id);if(on&&recycleIds.length<3)recycleIds.push(id);render()}
function recycleTier(){const chosen=recycleIds.map(id=>coachCards.find(p=>p.id===id&&!p.locked)).filter(Boolean);if(chosen.length!==3)return null;return Math.max(50,Math.min(90,Math.floor(chosen.reduce((a,p)=>a+p.packTier,0)/30)*10))}
function recycleModule(){
 recycleIds=recycleIds.filter(id=>coachCards.some(p=>p.id===id&&!p.locked));
 const tier=recycleTier();

function playerKorean(en){
 const parts=String(en||'').trim().split(/\s+/);
 if(parts.length===2)return (PLAYER_FIRST_KO[parts[0]]||parts[0])+' '+(PLAYER_LAST_KO[parts[1]]||parts[1]);
 return parts.map(p=>PLAYER_FIRST_KO[p]||PLAYER_LAST_KO[p]||p).join(' ');

function updateDisplayLanguage(lang){
 displayLanguage=lang==='en'?'en':'ko';
 localStorage.setItem('elevos-name-language',displayLanguage);
 for(let i=0;i<LEAGUES.length;i++){
  const l=LEAGUES[i];
  if(!l.nameEn)l.nameEn=l[1];
  l[1]=displayLanguage==='ko'?LEAGUE_NAMES_KO[i]:l.nameEn;
 }
 for(const c of clubs){
  // Immutable club identity is based on its original league/slot ID.
  // This repairs older saved careers containing user-entered or real-club names.
  const originalLeagueIndex=Math.floor(c.id/12),originalSlot=c.id%12;
  const canonical=LEAGUES[originalLeagueIndex]?.[3]?.[originalSlot]||c.nameEn||c.name;
  c.nameEn=canonical;
  const localeClub=CLUB_NAMES_KO[originalLeagueIndex]?.[originalSlot];
  c.name=displayLanguage==='ko'?(localeClub||canonical):canonical;
 }
 for(const p of players){
  if(!p.nameEn)p.nameEn=p.name;
  applyCuratedAsianName(p);
  p.name=localizedPlayerName(p);
 }
}
function nameLanguageSettings(){
 return '<button class="name-lang-button" onclick="toggleDisplayLanguage()" title="구단·선수 이름 언어 변경">이름 표시: '+(displayLanguage==='ko'?'한국어':'English')+'</button>';
}
function toggleDisplayLanguage(){
 updateDisplayLanguage(displayLanguage==='ko'?'en':'ko');save();render();
}

/* Game wallet: a one-time £1,000 starting balance.
 * Older saves receive the new wallet on first upgrade; they do not receive a repeat bonus.
 * Club cash remains legacy data and does not control the player wallet.
 */
const GBP_START=1000;

const ROLE_COLORS={FW:'#d84040',MF:'#3185dc',DF:'#a3db61',GK:'#edc53f'};

function playerRole(p){return ROLE_FAMILY[p.pos]||'MF'}

function preciseOverall(p){const d=detailed(p),keys=OVR_KEYS[p.pos]||OVR_KEYS.CM;return Math.min(120,keys.reduce((sum,k)=>sum+d[k],0)/keys.length+(enhancementLevel(p)-1)*1.5)}
function lineupComposition(ids,slots){
 const groups={FW:[],MF:[],DF:[],GK:[]};let total=0,fitTotal=0,filled=0;
 slots.forEach((slot,i)=>{
  const p=players.find(x=>x.id===ids[i]);if(!p)return;
  const fit=positionFit(p,slot.r),role=ROLE_FAMILY[slot.r]||'MF',score=preciseOverall(p)*fit*playerFitnessFactor(p);
  groups[role].push(score);total+=score;fitTotal+=fit;filled++;
 });
 const averages=Object.fromEntries(Object.entries(groups).map(([k,list])=>[k,list.reduce((a,b)=>a+b,0)/Math.max(1,list.length)]));
 const values=['FW','MF','DF'].map(r=>averages[r]);
 const balance=Math.min(...values)/Math.max(1,Math.max(...values));
 const chemistry=Math.round(Math.max(0,Math.min(100,(fitTotal/Math.max(1,filled))*75+balance*25)));
 return {mean:total/11,chemistry,bonus:(chemistry-75)*.12,attack:averages.FW*.6+averages.MF*.4,midfield:averages.MF,defense:averages.DF*.68+averages.GK*.32,filled};
}

 const top=players.filter(p=>p.club===clubId).sort((a,b)=>overall(b)-overall(a)).slice(0,11);
 return c.rating*.2+(top.reduce((n,p)=>n+preciseOverall(p),0)/Math.max(1,top.length))*.8;
}

 const choices={GK:[1,12,13,22,30],ST:[9,11,19,20,21],LW:[11,7,17,21],RW:[7,11,17,19],CAM:[10,8,18,20],CM:[8,6,14,10,16,18],CDM:[6,14,5,16,18],LM:[14,11,17,20],RM:[17,14,7,19],CB:[4,5,15,6,24],RB:[2,22,12,16],LB:[3,13,23,15]};
 for(const roster of byClub.values()){

  for(const p of roster){
   // Upgrade older automatically assigned numbers once. Explicit user edits are preserved.
   if(p.jerseyAutoVersion!==2&&!p.jerseyLocked)p.jerseyNumber=null;
   const n=Number(p.jerseyNumber);

  for(const p of missing){

/* Player availability and match injuries */
const INJURY_TYPES=[
 {name:'가벼운 타박상',min:1,max:2,severity:'minor'},
 {name:'발목 염좌',min:2,max:4,severity:'minor'},
 {name:'햄스트링 부상',min:5,max:10,severity:'major'},
 {name:'무릎 인대 부상',min:8,max:15,severity:'major'},
 {name:'시즌 아웃',min:22,max:22,severity:'major'}
];
function playerUnavailable(p){return !!p&&Number(p.injuryMatches||0)>0}
function injuryBadge(p){
 if(!playerUnavailable(p))return '';
 const major=p.injurySeverity==='major',color=major?'#c93131':'#e3ab17';
 return '<span class="injury-badge '+(major?'major':'minor')+'" title="'+txt(p.injuryType||'부상')+' · '+p.injuryMatches+'경기 결장" style="--injury-color:'+color+'"><span aria-hidden="true">✚</span> '+(major?'장기 부상':'경미한 부상')+' · '+p.injuryMatches+'경기</span>';
}
function injuryFor(p,forceKind){
 if(!p||playerUnavailable(p))return null;
 const roll=Math.random();
 const spec=forceKind!=null?INJURY_TYPES[forceKind]:INJURY_TYPES[roll<.64?0:roll<.85?1:roll<.95?2:roll<.992?3:4];
 const duration=spec.name==='시즌 아웃'?Math.max(1,22-round):spec.min+Math.floor(Math.random()*(spec.max-spec.min+1));
 p.injuryType=spec.name;p.injurySeverity=spec.severity;p.injuryMatches=duration;p.injuryStartRound=round;
 return {type:spec.name,remaining:duration,severity:spec.severity};
}
function healthyClubRoster(clubId){return players.filter(p=>p.club===clubId&&!playerUnavailable(p))}
function fixInjuredLineup(){
 if(manager===null)return;
 const current=currentLineup(),slots=FORMATIONS[formation],used=new Set(current.filter(id=>players.some(p=>p.id===id&&!playerUnavailable(p))));
 for(let i=0;i<current.length;i++){
  const p=players.find(p=>p.id===current[i]);
  if(p&&!playerUnavailable(p))continue;
  const available=healthyClubRoster(manager).filter(p=>!used.has(p.id)).sort((a,b)=>preciseOverall(b)*positionFit(b,slots[i].r)-preciseOverall(a)*positionFit(a,slots[i].r));
  const replacement=available[0];
  current[i]=replacement?replacement.id:null;
  if(replacement)used.add(replacement.id);
 }
}
function advanceInjuryRecovery(completedRound){

  if(!playerUnavailable(p))continue;

 }
}


function teamMatchLineup(teamId){

function assignTeamMatchLineup(teamId,ids){
 if(teamId===manager){simState.activeLineup=ids.slice();if(!simState.participants)simState.participants=[]}
 if(teamId===simState.home)simState.homeLineup=ids.slice();
 if(teamId===simState.away)simState.awayLineup=ids.slice();

function injuryOrAISub(teamId,injured,forced=false){
 if(!simState)return false;
 const current=teamMatchLineup(teamId).slice(),out=injured||players.find(p=>p.id===current[(simState.minute*7+teamId)%11]);
 if(!out||!current.includes(out.id))return false;
 const ours=teamId===manager,previous=ours?(simState.substitutions||[]):(simState.aiSubstitutions||[]),limit=5;
 if(previous.length>=limit)return false;
 const unused=eligibleMatchBench(teamId);
 const slot=current.indexOf(out.id),slotRole=(FORMATIONS[ours?(simState.formation||formation):'433']||FORMATIONS['433'])[slot]?.r||out.pos;
 const next=unused.sort((a,b)=>preciseOverall(b)*positionFit(b,slotRole)-preciseOverall(a)*positionFit(a,slotRole))[0];
 if(!next)return false;
 current[slot]=next.id;assignTeamMatchLineup(teamId,current);
 if(ours){simState.participants.push(next.id)}
 const entry={minute:simMinuteLabel(simState.minute),out:out.id,in:next.id,club:teamId,forced};
 if(ours)simState.substitutions.push(entry);else{if(!simState.aiSubstitutions)simState.aiSubstitutions=[];simState.aiSubstitutions.push(entry)}
 simEvent(teamId,next,'sub',out.name+' OUT → '+next.name+' IN',forced||teamId!==manager?null:'SUBSTITUTION');
 return true;
}

 const p=injured||players.find(p=>p.id===teamMatchLineup(teamId)[6]);
 if(!p||!activeMatchPlayers(teamId).some(x=>x.id===p.id))return;
 const injury=injuryFor(p);
 simEvent(teamId,p,'injury',p.name+' 부상! '+injury.type+' · '+injury.remaining+'경기 결장 예상','INJURY');
 if(!injuryOrAISub(teamId,p,true)){const ids=teamMatchLineup(teamId).slice(),slot=ids.indexOf(p.id);if(slot>=0){ids[slot]=null;assignTeamMatchLineup(teamId,ids)}}
}
function scheduleAutoSubstitutions(){
 const m=simState;if(!m)return;
 const clock=simMinuteLabel(m.minute);
 const minuteNum=parseInt(clock,10);
 if(![54,63,72,81].includes(minuteNum))return;
 for(const id of [m.home,m.away]){
  const current=teamMatchLineup(id),subList=id===manager?m.substitutions:m.aiSubstitutions;
  if((subList||[]).length>=4)continue;
  if(id===manager&&(m.autoSubstitution===false||m.manualCoaching))continue;
  const eligible=current.map(x=>players.find(p=>p.id===x)).filter(p=>p&&!playerUnavailable(p)&&p.pos!=='GK');
  if(!eligible.length)continue;
  const target=eligible[(Math.floor(m.minute/9)+id)%eligible.length];
  injuryOrAISub(id,target,false);
 }
}


/* Event-driven 2D pitch: saved player points move with ball and possession. */
function moveMatchObjects(homeAttack,type){
 const m=simState;if(!m)return;
 const attacker=homeAttack?m.home:m.away;
 const previous=m.ball||{x:50,y:50},reversed=attacker!==m.possession;
 m.previousBall={x:previous.x,y:previous.y};
 const direction=homeAttack?1:-1;
 let x,y;
 if(['goal','provisional','shot','penalty'].includes(type)){x=homeAttack?90:10;y=33+Math.random()*34}
 else if(['pass','attack'].includes(type)){x=reversed?(homeAttack?36:64):previous.x+direction*(8+Math.random()*12);y=reversed?28+Math.random()*44:previous.y+(Math.random()-.5)*25}
 else{x=homeAttack?43+Math.random()*27:30+Math.random()*27;y=14+Math.random()*72}
 const clamp=(v,lo=5,hi=95)=>Math.max(lo,Math.min(hi,v));
 m.ball={x:clamp(x),y:clamp(y,8,92)};
 m.possession=attacker;m.phase=type;
 if(!m.positions)m.positions={home:[],away:[]};
 for(const side of ['home','away']){
  const isHome=side==='home',ids=isHome?m.homeLineup:m.awayLineup,slots=FORMATIONS[(isHome?m.homeFormation:m.awayFormation)||'433'];
  const old=m.positions[side]||[];
  m.positions[side]=slots.map((slot,i)=>{
   const role=ROLE_FAMILY[slot.r]||'MF',baseX=isHome?100-slot.y:slot.y,baseY=slot.x;
   const follow={GK:.02,DF:.17,MF:.31,FW:.38}[role],shift={GK:0,DF:2,MF:5,FW:8}[role];
   const toX=baseX+(m.ball.x-baseX)*follow+(isHome?1:-1)*shift*(homeAttack===isHome?1:-.65);
   const toY=baseY+(m.ball.y-baseY)*(role==='GK'?.03:.24);
   const prev=old[i]||{x:baseX,y:baseY},step=role==='GK'?2:role==='DF'?6:9;
   return {id:ids?.[i],x:clamp(prev.x+Math.max(-step,Math.min(step,toX-prev.x))),y:clamp(prev.y+Math.max(-step,Math.min(step,toY-prev.y)),7,93)};
  });
 }
}

function cupBracketContent(key,startStage){
 const d=CUP_RULES[key],c=cupState[key];if(!d||!c)return '';
 const stages=d.stages.length,start=Math.max(0,Math.min(stages-1,startStage??Math.max(0,Math.min(c.stage,stages-3)))),cols=stages-start,step=108,cardH=86,gap=44,w=210;
 const rounds=d.stages.map((_,i)=>{
  const count=2**(stages-i-1),history=c.history.find(h=>h.stage===i);
  if(history){
   const arr=history.games||[];
   if(arr.length===count)return arr;
   const next=c.history.find(h=>h.stage===i+1)?.games;
   const winners=i+1===c.stage?c.teams:next&&next.length===count/2?next.flatMap(g=>[g.home,g.away]):null;
   if(winners&&winners.length===count){const remaining=arr.slice();return winners.map(id=>{if(id==null)return null;const j=remaining.findIndex(g=>g.winner===id);return j<0?null:remaining.splice(j,1)[0]})}
   return null;
  }
  if(i===c.stage&&!c.completed)return Array.from({length:count},(_,j)=>({home:c.teams[j*2],away:c.teams[j*2+1]}));
  return Array(count).fill(null);
 });
 const team=(id,score,winner,known)=>'<div class="bracket-team '+(known&&id!=null?(winner===id?'qualified':'knocked-out'):'')+(id===manager?' own-team':'')+'">'+(id!=null&&clubs[id]?shield(clubs[id])+'<span>'+txt(clubs[id].name)+'</span>':'<span class="bracket-unknown">'+(known?'부전승':'미정')+'</span>')+'<b>'+(score??'–')+'</b></div>';
 const lines=[],cards=[],heads=[];let missing=false;
 for(let i=start;i<stages;i++){
  const col=i-start,n=2**(stages-i-1),x=col*(w+gap),games=rounds[i];
  heads.push('<div class="bracket-heading" style="left:'+x+'px;width:'+w+'px">'+d.stages[i]+'</div>');
  if(!games)missing=true;
  for(let j=0;j<n;j++){
   const cy=(j+.5)*step*2**col,top=cy-cardH/2,g=games?.[j],known=g?.winner!=null,mine=g&&[g.home,g.away].includes(manager);
   cards.push('<div class="bracket-match '+(mine?'mine ':'')+(known?'finished':'')+'" style="left:'+x+'px;top:'+top+'px;width:'+w+'px;height:'+cardH+'px">'+team(g?.home,g?.hg,g?.winner,known)+team(g?.away,g?.ag,g?.winner,known)+'<div class="bracket-match-status">'+(g?.bye?'부전승':known?(g.shootout?'PK '+g.shootout.home+' : '+g.shootout.away:'경기 종료'):g&&(g.home!=null||g.away!=null)?'경기 예정':'대진 미정')+'</div></div>');
   if(i<stages-1&&games&&rounds[i+1]){
    const target=(Math.floor(j/2)+.5)*step*2**(col+1),mid=x+w+gap/2;
    lines.push('<path d="M '+(x+w)+' '+cy+' H '+mid+' V '+target+' H '+(x+w+gap)+'" class="'+(mine&&g.winner===manager?'mine-path':'')+'"/>');
   }
  }
 }
 const width=cols*w+(cols-1)*gap,height=2**(cols-1)*step;
 return '<div class="bracket-controls"><span>라운드 선택</span>'+d.stages.map((stage,i)=>'<button class="btn sub mini '+(i===start?'on':'')+'" onclick="showBracketStage(\''+key+'\','+i+')">'+stage+'부터</button>').join('')+'</div><div class="bracket-scroll"><div class="bracket-canvas" style="width:'+width+'px"><div class="bracket-headings">'+heads.join('')+'</div><div class="bracket-body" style="height:'+height+'px"><svg class="bracket-lines" width="'+width+'" height="'+height+'" aria-hidden="true">'+lines.join('')+'</svg>'+cards.join('')+'</div></div></div>'+(missing?'<p class="muted small">이전 시즌의 일부 부전승 위치 기록은 복원할 수 없어 연결선을 표시하지 않습니다.</p>':'');
}
