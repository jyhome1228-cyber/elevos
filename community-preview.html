<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ELEVOS | 커뮤니티</title><style>*{box-sizing:border-box}body{margin:0;background:#141614;color:#eee;font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,a,input,select{outline-offset:4px}header{background:#111;position:sticky;top:0;z-index:2;border-bottom:1px solid #292b28}.wrap{max-width:1440px;margin:auto;padding:0 40px}.head{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:76px}.logo{font-size:27px;font-weight:900;font-style:italic;letter-spacing:-2px}nav{display:flex;gap:25px;flex-wrap:wrap}nav a{font-size:14px;font-weight:650;color:#b9bcb6}nav a[aria-current]{color:#e2c990}.cta{background:#eee;color:#111;padding:11px 18px;border-radius:4px;font-weight:700;font-size:14px}.hero{background:linear-gradient(110deg,#20271e,#151815);padding:64px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:#dfc58b;font-weight:700}h1{font-size:36px;margin:12px 0}p{line-height:1.7;color:#bfc3ba}main{padding-top:34px!important;padding-bottom:80px!important;min-height:55vh}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}input,select{background:#20231f;color:#eee;border:1px solid #3b4038;border-radius:4px;padding:12px}button{background:#242822;color:#eee;border:1px solid #383d35;border-radius:4px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.item{display:block;width:100%;text-align:left;padding:24px;background:#20241f;border:1px solid #30352e;border-radius:6px;cursor:pointer;color:inherit}.item:hover{border-color:#bca675}.tag{font-size:12px;color:#e2c990}.item h2{font-size:19px;line-height:1.5;margin:12px 0}.date{font-size:13px;color:#b6bbb2}.list{display:grid;gap:8px}.list .item{display:grid;grid-template-columns:110px 1fr 150px;align-items:center;gap:12px}.list h2{margin:0;font-size:16px}.empty{padding:64px 20px;text-align:center;border:1px solid #30352e;border-radius:6px}.detail{max-width:880px;padding:30px 0}.detail h2{font-size:27px}.detail p{white-space:pre-wrap}.back{margin-bottom:24px}footer{border-top:1px solid #30352e;padding:30px 0;color:#a9ada4;font-size:13px}@media(max-width:750px){.wrap{padding:0 20px}.head{flex-wrap:wrap;padding-top:15px;padding-bottom:15px;gap:12px}nav{order:3;width:100%;gap:18px}.hero{padding:40px 0}h1{font-size:29px}.cards{grid-template-columns:1fr}.list .item{grid-template-columns:70px 1fr}.list .date{grid-column:2}.toolbar input{max-width:100%}}</style></head><body><header><div class="wrap head"><a class="logo" href="./">ELEVOS</a><nav aria-label="커뮤니티 메뉴"><a href="?tab=events">이벤트</a><a href="?tab=notice">공지사항</a><a href="?tab=community">자유게시판</a><a href="?tab=guide">게임가이드</a></nav><a class="cta" href="./">공식 홈페이지</a></div></header><section class="hero"><div class="wrap"><div class="eyebrow" id="en"></div><h1 id="title"></h1><p id="desc"></p></div></section><main class="wrap"><div class="toolbar" id="toolbar"><span id="count"></span><div><input type="search" id="search" placeholder="게시물 검색" aria-label="게시물 검색"> <button id="write" hidden disabled>글쓰기 · 연동 준비 중</button></div></div><div id="content"></div></main><footer><div class="wrap">ELEVOS · MANAGING SOCCER<br><p>커뮤니티 화면 초안 · 게시물 및 계정 연동 전</p></div></footer><script>const data={"events":{"title":"이벤트","en":"EVENTS","desc":"감독님의 새로운 도전을 위한 특별한 혜택.","items":[["진행 중","오픈 베타 특별 보급","2026.11.24 – 12.31","베타 기간 동안 게임 내 선물함에서 대상 보급을 확인하세요. 실제 지급 조건과 수량은 게임 내 안내를 기준으로 합니다."],["안내","매일 접속 선물","베타 기간","게임에 접속하여 선물함에서 일일 보상을 확인하세요."],["안내","주말 접속 선물","베타 기간","주말 접속 보상은 게임 내 이벤트 안내에서 확인할 수 있습니다."]]},"notice":{"title":"공지사항","en":"NOTICE","desc":"ELEVOS의 운영 소식과 업데이트를 확인하세요.","items":[["안내","오픈 베타 이용 안내","초안","베타 기간에는 게임 기능과 밸런스가 변경될 수 있습니다."],["안내","게임 저장 및 계정 이용 안내","초안","기존 감독 계정으로 접속하여 저장된 커리어를 이용하세요."]]},"community":{"title":"자유게시판","en":"COMMUNITY","desc":"다른 감독들과 축구 이야기를 나누세요.","items":[]},"guide":{"title":"게임가이드","en":"GAME GUIDE","desc":"첫 번째 경기부터 전설적인 감독 커리어까지.","items":[["시작","처음 시작하기","","계정을 생성하고 구단을 선택한 뒤 튜토리얼을 진행하세요."],["선수","선수 카드와 시즌","","카드 등급과 시즌, 포지션, OVR을 확인해 선수단을 구성하세요."],["육성","선수 강화와 성장","","강화 화면에서 재료와 성공 확률, 실패 시 적용되는 규칙을 확인하세요."],["전술","선수단 및 전술 설정","","포메이션과 선수 포지션을 설정하고 경기 전 선발 명단을 확인하세요."],["경기","리그 및 경기 진행","","경기 결과와 리그 일정을 확인하고 구단을 운영하세요."],["시장","이적시장과 트레이드","","선수 영입과 판매, 트레이드를 통해 선수단을 개선하세요."]]}};const params=new URLSearchParams(location.search);const tab=Object.hasOwn(data,params.get('tab'))?params.get('tab'):'events';const page=data[tab];const $=id=>document.getElementById(id);$('en').textContent=page.en;$('title').textContent=page.title;$('desc').textContent=page.desc;document.title=page.title+' | ELEVOS';document.querySelectorAll('nav a').forEach(a=>{if(a.getAttribute('href')==='?tab='+tab)a.setAttribute('aria-current','page')});$('write').hidden=tab!=='community';function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}function render(){const q=$('search').value.trim().toLowerCase();const items=page.items.map((v,i)=>({v,i})).filter(({v})=>v.join(' ').toLowerCase().includes(q));$('count').textContent='전체 '+items.length+'건';const c=$('content');c.replaceChildren();c.className=tab==='events'?'cards':'list';if(!items.length){const e=el('div','empty',q?'검색 결과가 없습니다.':'아직 등록된 게시물이 없습니다.');e.style.gridColumn='1 / -1';c.append(e);return}for(const {v,i} of items){const a=el('a','item');a.href='?tab='+tab+'&post='+i;a.append(el('span','tag',v[0]),el('h2','',v[1]),el('span','date',v[2]));if(tab==='events')a.append(el('p','',v[3]));c.append(a)}}$('search').addEventListener('input',render);const post=params.get('post');if(post!==null&&/^\d+$/.test(post)&&page.items[Number(post)]){const v=page.items[Number(post)];$('toolbar').hidden=true;const c=$('content');c.className='detail';const back=el('a','back','← 목록으로');back.href='?tab='+tab;c.append(back,el('h2','',v[1]),el('span','date',v[0]+'  '+v[2]),el('p','',v[3]));}else render();</script></body></html>
