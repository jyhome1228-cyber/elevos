const data=window.ELEVOS_HALL;const meta={ballon:['BALLON D’OR','#d9bc7b','#584b32'],moment:['ONE MOMENT','#a6d9c4','#285946'],legend:['LEGEND ELITE','#d2b1f3','#453259'],red:['RED ELITE','#ff8794','#592634']};let tier='ballon',current=0;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const style=k=>'--accent:'+meta[k][1]+';--shade:'+meta[k][2];function face(p){const f=p.face;return '<span class="face" style="background-image:url('+f.url+');background-size:'+f.cols*100+'% '+f.rows*100+'%;background-position:'+f.x+'% '+f.y+'%"></span>'}function card(p,k,i,interactive=true){return '<'+(interactive?'button':'div')+' class="card '+k+'" style="'+style(k)+'" '+(interactive?'data-i="'+i+'" type="button"':'')+'><div class="top"><b>'+p.ovr+'</b><small>'+p.pos+'</small></div>'+face(p)+'<strong>'+esc(p.name)+'</strong><small>'+esc(p.nation)+'</small><div class="honor">'+esc(p.honor)+'</div><div class="title">'+esc(p.title)+'</div><small>'+meta[k][0]+'</small></'+(interactive?'button':'div')+'>'}function render(){const q=$('search').value.toLowerCase().trim();$('tabs').innerHTML=Object.keys(meta).map(k=>'<button type="button" data-tier="'+k+'" class="'+(tier===k?'on':'')+'">'+meta[k][0]+' · '+data[k].length+'</button>').join('');$('grid').innerHTML=data[tier].map((p,i)=>({p,i})).filter(({p})=>(p.name+' '+p.en).toLowerCase().includes(q)).map(({p,i})=>card(p,tier,i)).join('')||'<div class="empty">검색 결과가 없습니다.</div>'}function openRecord(i){const arr=data[tier],p=arr[i];if(!p)return;current=i;const dlg=$('record');dlg.setAttribute('style',style(tier));dlg.innerHTML='<div class="head"><strong>HALL OF FAME · '+meta[tier][0]+'</strong><div class="pager"><button data-prev>‹ '+esc(arr[(i+arr.length-1)%arr.length].name)+'</button><span>'+(i+1)+' / '+arr.length+'</span><button data-next>'+esc(arr[(i+1)%arr.length].name)+' ›</button></div><button class="close" data-close aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div><div class="detail '+(p.photo?'hasphoto':'')+'">'+(p.photo?'<img class="photo" src="'+p.photo+'" alt="'+esc(p.name)+' 경기 사진">':'')+'<div class="story"><div class="eyebrow">'+esc(p.honor)+'</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.en)+' · '+esc(p.nation)+' · '+p.pos+'</p><div class="nums">'+['통산 출전','통산 득점','통산 도움'].map((n,j)=>'<div><b>'+p.stats[j]+'</b><small>'+n+'</small></div>').join('')+'</div><h3>'+esc(p.title)+'</h3><p>'+esc(p.story)+'</p><h3>커리어 기록</h3><div class="facts"><div><small>활동 기간</small><strong>'+esc(p.period)+'</strong></div><div><small>주요 소속 구단</small><strong>'+esc(p.club)+'</strong></div><div><small>주요 기록</small><strong>'+esc(p.honor)+'</strong></div></div></div><aside class="profile">'+card(p,tier,i,false)+'<p>명예의 전당 기본 카드 · OVR '+p.ovr+'</p></aside></div>'+((p.related||[]).length?'<div class="related"><strong>가문의 전설</strong><div>'+p.related.map(j=>'<button data-related="'+j+'">'+esc(arr[j].name)+'</button>').join('')+'</div></div>':'')+'<p class="disclaimer">ELEVOS 세계관의 가상 선수 및 커리어 기록입니다.</p>';if(!dlg.open)dlg.showModal();dlg.scrollTop=0;dlg.querySelector('[data-close]').focus({preventScroll:true})} $('tabs').onclick=e=>{const b=e.target.closest('[data-tier]');if(b){tier=b.dataset.tier;render()}};$('search').oninput=render;$('grid').onclick=e=>{const b=e.target.closest('[data-i]');if(b)openRecord(Number(b.dataset.i))};$('record').onclick=e=>{const b=e.target.closest('button');if(!b){if(e.target===$('record')){const r=$('record').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('record').close()}return}if(b.hasAttribute('data-close'))$('record').close();else if(b.hasAttribute('data-prev'))openRecord((current+data[tier].length-1)%data[tier].length);else if(b.hasAttribute('data-next'))openRecord((current+1)%data[tier].length);else if(b.hasAttribute('data-related'))openRecord(Number(b.dataset.related))};$('record').onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();openRecord((current+(e.key==='ArrowLeft'?-1:1)+data[tier].length)%data[tier].length)}};const init=new URLSearchParams(location.search).get('tier');if(meta[init])tier=init;render();</script></body></html>
